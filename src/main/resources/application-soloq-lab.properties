# Explicit local simulation. Real Battle.net/device/evidence integrations remain disabled.
server.address=127.0.0.1
server.port=8082
management.server.address=127.0.0.1
management.server.port=8083
spring.datasource.url=jdbc:postgresql://localhost:55432/rbgs_soloq_lab
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
spring.session.jdbc.table-name=rbgs.spring_session
server.servlet.session.cookie.name=RBGS_SOLOQ_LAB
server.servlet.session.cookie.secure=false
rbgs.notifications.sending-enabled=false
rbgs.capture.controlled-enabled=false
rbgs.auth.web-origin=http://127.0.0.1:5174
spring.datasource.hikari.maximum-pool-size=8
