  /matches/{id}/result:
    get:
      operationId: getMatchResult
      summary: Read a match result as a participant or active moderator
      description: No-store. Returns only result, independent reporting coverage and server deadline, without raw reports or account identities. PENDING awaits reports; VERIFIED requires six accounts from each assigned team; REVIEW has no canonical outcome. Exact roster, full observed identity, bijective team mapping, known map, plausible timing and all historical report revisions are compared. Optional statistics are retained per report and never selected as canonical. The deadline is 15 minutes after the first usable final report; without a usable final report the test expires four hours and 15 minutes after armUntil. Incomplete captures do not start the final-report timer. Match mode records CONTROLLED_TEST or MATCHMADE independently of the evidence policy. The test feature flag only gates CONTROLLED_TEST matches. MATCHMADE is an internal model foundation; no matchmaking creation endpoint or ranked activation is provided. A result is not Blizzard ownership or a rating movement.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Persisted result; background processing can update this snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '401': { description: "Web login required" }
        '403': { description: "Inactive account" }
        '404': { description: "No visible test" }
        '503': { description: "Controlled testing disabled" }
