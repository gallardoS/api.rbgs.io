openapi: 3.1.0
info:
  title: rbgs.io API
  version: 1.0.0
  description: Foundation and Battle.net session contract. Other product endpoints are added with their owning features.
servers:
  - url: /api/v1
paths:
  /characters/me:
    get:
      operationId: getCurrentUserCharacters
      summary: Get the authenticated user's WoW accounts and characters in EU
      description: Requires a Battle.net session with wow.profile permission. Queries Blizzard using the user's token; never returns tokens. Does not persist character associations.
      responses:
        '200':
          description: WoW accounts and their owned characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WowAccountProfile'
        '401':
          description: Missing session or expired Battle.net token; sign in again
        '403':
          description: Missing wow.profile permission or Blizzard profile privacy restriction
        '404':
          description: No accessible WoW profile in EU
        '502':
          description: Blizzard unavailable or returned an invalid response
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current rbgs.io account and establish a CSRF cookie
      description: Returns no content when the browser has no authenticated session. Never returns provider tokens.
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '204':
          description: No authenticated session
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the browser session
      description: Requires the X-XSRF-TOKEN header copied from the XSRF-TOKEN cookie.
      responses:
        '204':
          description: Session invalidated
        '403':
          description: Missing or invalid CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health:
    get:
      operationId: getHealth
      summary: Check API availability
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
components:
  schemas:
    WowAccountProfile:
      type: object
      required: [wow_accounts]
      properties:
        wow_accounts:
          type: array
          items:
            type: object
            required: [id, characters]
            properties:
              id:
                type: integer
                format: int64
              characters:
                type: array
                items:
                  $ref: '#/components/schemas/WowCharacter'
    WowCharacter:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        level:
          type: integer
        realm:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            slug:
              type: string
        playable_class:
          $ref: '#/components/schemas/WowNamedReference'
        playable_race:
          $ref: '#/components/schemas/WowNamedReference'
        faction:
          $ref: '#/components/schemas/WowNamedReference'
    WowNamedReference:
      type: object
      properties:
        id:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        type:
          type: [string, 'null']
    Profile:
      type: object
      required: [id, displayName, region, role]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        region:
          type: string
          const: EU
        role:
          type: string
          enum: [USER, MODERATOR]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
