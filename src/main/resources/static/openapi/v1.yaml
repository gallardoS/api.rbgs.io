        '429': { description: 'Message rate limit reached' }
  /moderation/matches:
    get:
      operationId: listModerationMatches
      summary: List persisted matches for an active moderator
      description: No-store. Uses current persisted account status and role. Newest first by createdAt and UUID descending, with opaque keyset pagination. Disabled controlled tests are omitted; other match modes remain visible. Summary includes declared players and usable independent reports per team, without raw reports, account IDs, assignment codes or credentials. CANCELLED is a display filter over cancelledAt; other state filters exclude cancelled matches. canCancel is true only for available controlled tests without cancellation or a prior moderator decision. Reading establishes the CSRF cookie for subsequent moderator commands.
      security: [{ webSession: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ALL, PENDING, REVIEW, VERIFIED, RESOLVED, VOIDED, CANCELLED], default: ALL } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 256 }, description: 'Use nextCursor from the previous page with the same filter' }
      responses:
        '200':
          description: A bounded page of persisted match summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationMatchPage' }
        '400': { description: 'Invalid state, size or cursor' }
        '401': { description: 'Web login required' }
        '403': { description: 'Current active moderator required' }
  /moderation/capture-tests:
    post:
      operationId: createControlledCaptureTest
      summary: Create an individual capture or a controlled Darkspear roster test
      description: Requires an active persisted MODERATOR web account, CSRF, and RBGS_CONTROLLED_CAPTURE_ENABLED. Declared identities are unverified. No ranked match or rating is created. CAPTURE_ONLY permits exactly the authenticated moderator account and its declared character with teamKey null; no expected opponent/team is asserted. ROSTER_CONTROLLED (the default) requires at least one active reporter and both assigned teams. Full names must be unique after NFC normalization, trimming and case folding. Controlled roster results can be verified with six concordant accounts per team and no essential contradictions. CAPTURE_ONLY remains unverifiable. Ten requests per moderator per minute.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [armMinutes, roster]
              properties:
                armMinutes: { type: integer, minimum: 5, maximum: 120 }
                testKind: { type: string, enum: [ROSTER_CONTROLLED, CAPTURE_ONLY], default: ROSTER_CONTROLLED }
                expectedMapProfile: { type: string, enum: [DARKSPEAR_DIAGNOSTIC], default: DARKSPEAR_DIAGNOSTIC, description: "Temporary TBC WSG tests require the separate Anniversary endpoint with an owned character selection." }
                roster:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [accountId, character, teamKey]
                    properties:
                      accountId: { type: [string, 'null'], format: uuid }
                      character: { $ref: '#/components/schemas/CaptureIdentity' }
                      teamKey: { type: [string, 'null'], enum: [A, B, null] }
              allOf:
                - if:
                    required: [testKind]
                    properties:
                      testKind: { const: CAPTURE_ONLY }
                  then:
                    properties:
                      roster:
                        minItems: 1
                        maxItems: 1
                        items:
                          properties:
                            accountId: { type: string, format: uuid }
                            teamKey: { type: 'null' }
                  else:
                    properties:
                      roster:
                        minItems: 2
                        items:
                          properties:
                            teamKey: { type: string, enum: [A, B] }
      responses:
        '200': { description: "Test match ID, CONTROLLED_TEST mode, testKind, armUntil and per-account assignmentId/captureId; no plaintext code" }
        '401': { description: "Web login required" }
        '403': { description: "Active moderator and CSRF required" }
        '422': { description: "Invalid or unsupported roster" }
        '429': { description: "Retry-After 60 seconds" }
        '503': { description: "Controlled capture testing disabled" }
  /moderation/capture-tests/anniversary/characters:
    get:
      operationId: getOwnAnniversaryTestCharacters
      summary: Load own Anniversary characters for temporary moderator tests
      description: Requires current active MODERATOR, controlled capture enabled and the web account's Battle.net authorization with wow.profile. Queries profile-classicann-eu and profile-classicann-us only. No normal season or ranked eligibility is established. Characters from level 1 are returned for test selection, without the ordinary preview's level-60 filter; game access is separate. Cache is isolated by account, token digest and test environment, with 60-second TTL. Expired tokens and missing scope fail before cached data. Optional media/profile failures preserve the authenticated basic list. Returns no-store.
