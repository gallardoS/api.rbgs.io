      summary: Ask a participant for more information or a saved-capture resync
      description: Requires current conversation version. Appends an immutable moderator message, sets WAITING_PLAYER and creates a persistent unread marker. Closed conversations cannot receive requests. Existing moderator result decisions close conversations and append the participant-visible reason in the same transaction; test cancellation also closes open conversations with a localized cancellation notice.
