openapi: 3.1.0
info:
  title: rbgs.io API
  version: 1.0.0
  description: Foundation, Battle.net sessions, character profiles and season launch notifications. Other product endpoints are added with their owning features.
servers:
  - url: /api/v1
paths:
  /auth/api-client/requests:
    post:
      operationId: startApiClientLogin
      x-spring-profiles: [local]
      summary: Start a five-minute API client login handoff
      security: []
      description: Native transport only; rejects Origin and Sec-Fetch-Site. Returns approvalPath with browser-only
        secret in fragment, distinct pollingSecret, expiresIn=300 and intervalSeconds=5. Five starts per IP per minute.
        In-memory on one instance; restarting invalidates pending requests. Browser approval is explicit and the server
        retains the Battle.net authorized client.
      responses:
        '200':
          description: approvalPath, pollingSecret, expiresIn, intervalSeconds; no-store
        '403':
          description: Browser transport forbidden
        '429':
          description: Rate limited
  /auth/api-client:
    get:
      operationId: apiClientApprovalPage
      x-spring-profiles: [local]
      security: []
      responses:
        '200':
          description: Uncached HTML page; reads approval secret from URL fragment and asks explicit approval after
            web login
  /auth/api-client/login:
    get:
      operationId: loginForApiClient
      x-spring-profiles: [local]
      security: []
      responses:
        '302':
          description: Start normal Battle.net OAuth and return to the fixed approval page
  /auth/api-client/approve:
    post:
      operationId: approveApiClientLogin
      x-spring-profiles: [local]
      security:
      - webSession: []
      description: Requires active account and CSRF. Browser-only approval secret. Approval is single-use, does not
        extend expiry, and does not disclose any credential.
      responses:
        '204':
          description: Approved
        '401':
          description: Web session or Battle.net authorized client missing
        '403':
          description: Account inactive or invalid CSRF
        '410':
          description: Expired, unknown or already approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
  /auth/api-client/token:
    post:
      operationId: exchangeApiClientLogin
      x-spring-profiles: [local]
      security: []
      description: Native polling secret only. Rejects Origin/Sec-Fetch-Site and existing sessions. Send without Cookie.
        PENDING until explicit browser approval. PAIRED creates an independent web session and transfers the authorized
        client server-side, returning sessionId and csrfToken, never a Battle.net token. Active account is rechecked.
        Single-use; lost successful response requires a new login. No-store. 120 polls per IP per minute.
      responses:
        '200':
          description: status PENDING with null credentials, or PAIRED with sessionId and csrfToken
        '403':
          description: Browser transport or inactive account
        '409':
          description: Existing session cookie must be omitted
        '410':
          description: Expired, unknown or consumed
        '429':
          description: Rate limited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
  /device-launches:
    post:
      operationId: authorizeCompanionLaunch
      summary: Open and connect the companion with capture permissions
      description: Active web session and X-XSRF-TOKEN required. The user-initiated web action submits the approved linking and capture authorization. Derives the account from the session. Returns a 120-second launch ticket for rbgs-companion://connect/TICKET, never a device credential. Ten requests per identity per minute. Ticket must not be logged or stored persistently.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptCapturePermissions]
              properties:
                acceptCapturePermissions: { type: boolean, const: true }
      responses:
        '200':
          description: 'Short-lived native launch ticket; no-store'
          content:
            application/json:
              schema:
                type: object
                required: [id, launchSecret, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  launchSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  expiresAt: { type: string, format: date-time }
        '401': { description: 'Web session required' }
        '403': { description: 'CSRF, active account and explicit capture consent required' }
        '429': { description: 'Retry-After 60 seconds' }
  /device-launches/{id}:
    get:
      operationId: inspectCompanionLaunch
      summary: Read connection progress for an own launch
      description: Only the active account that created the launch can inspect it. PAIRED requires an authenticated native heartbeat after creation. No credential, ticket or native proof is returned. Poll every two seconds; 120 reads per identity per minute. Browser selects the returned own device after completion.
      security: [{ webSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'Own connection progress; no-store'
          content:
            application/json:
              schema:
                type: object
                required: [status, deviceId, expiresAt]
                properties:
                  status: { type: string, enum: [PENDING, CONNECTING, PAIRED] }
                  deviceId: { type: [string, 'null'], format: uuid, description: 'Only returned after the native heartbeat' }
                  expiresAt: { type: string, format: date-time }
        '401': { description: 'Web session required' }
        '403': { description: 'Active account required' }
        '410': { description: 'Unknown, expired, another account, or revoked/expired device' }
        '429': { description: 'Retry-After 60 seconds' }
  /companion/connect:
    post:
      operationId: redeemCompanionLaunch
      summary: Redeem a web launch from native code
      description: Stateless native transport; ignores web cookies and rejects Origin or Sec-Fetch-Site headers. Requires the web-issued launchSecret and a new 32-byte random lowercase-hex clientSecret held only in native memory. First redemption atomically binds the proof and device; same proof may recover a lost response within ticket expiry. Different proofs and revoked/expired devices cannot replay. Optional existing bearer reuses the same account device and upgrades capture scope without rotating its credential; a different account returns 409. Invalid bearer returns 401 and native may retry without it. New issuance obeys the five-device limit. All credentials remain hashed in storage. Native verifies and saves credentials in Windows before sending heartbeat.
      security: []
      parameters:
        - { name: Authorization, in: header, required: false, schema: { type: string }, description: 'Optional existing device Bearer credential' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [launchSecret, clientSecret]
              properties:
                launchSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                clientSecret: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: 'Native credential issuance or existing credential reuse; no-store'
          content:
            application/json:
              schema:
                type: object
                required: [status, token, deviceId, expiresAt, scope]
                properties:
                  status: { type: string, const: PAIRED }
                  token: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{43}$', description: 'Null when reusing the existing bearer' }
                  deviceId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
                  scope: { type: string, const: 'companion:status companion:assignments evidence:write' }
        '400': { description: 'Invalid ticket or native proof' }
        '401': { description: 'Invalid, revoked or expired supplied bearer' }
        '403': { description: 'Browser transport forbidden' }
        '409': { description: 'Different account or active device limit reached' }
        '410': { description: 'Unknown, expired, already claimed with another proof, revoked device or inactive launch account' }
        '429': { description: 'Retry-After 60 seconds; 120 per IP and 30 per ticket per minute' }
  /companion/heartbeat:
    post:
      operationId: recordCompanionHeartbeat
      summary: Record a native device connection signal
      description: Stateless device bearer authorization; web cookies cannot substitute it. Both existing status-only and capture-scoped active devices can send. Uses server receipt time; no client timestamp, game state or ownership claim. Twelve requests per device per minute. Native schedule is approximately 15 seconds. Web connected status expires 45 seconds after the latest signal and is immediately false for revoked/expired devices. Ordinary GET status does not record presence.
      security: [{ deviceCredential: [] }]
      responses:
        '200': { description: 'Authorized deviceId, accountId, current scope and accountName; no-store' }
        '401': { description: 'Missing, invalid, revoked or expired device or inactive account' }
        '429': { description: 'Retry-After 60 seconds' }
  /device-pairings/browser/details:
    post:
      operationId: previewBrowserPairing
      summary: Inspect a short-lived native connection request
      description: Active web session and CSRF required. approvalSecret is separate from the native polling secret and is submitted only in the body. Preview never approves. The URL fragment is removed by the frontend; its temporary handle can survive a login redirect in session storage for at most five minutes. After approval only the approving account can inspect the request. The PAIRED state means credential issuance, not a heartbeat. No device token or native polling secret is returned. 120 reads per signed-in identity per minute.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserPairingApproval' }
      responses:
        '200':
          description: 'Signed-in accountName, scope, expiresAt, PENDING/APPROVED/PAIRED and nullable deviceId; no device name; no-store'
        '403': { description: 'Web account and CSRF required; device bearer is insufficient' }
        '410': { description: 'Unknown, expired or approved for another account' }
  /device-pairings/browser/approve:
    post:
      operationId: approveBrowserPairing
      summary: Explicitly approve the displayed PC and permissions without typing a code
      description: Same short-lived handle and web/CSRF requirements as preview. Single approval only; does not extend expiry. Scope is frozen at creation. Capture-scoped requests require acceptCapturePermissions=true; the approval button explicitly describes those permissions. The native process alone exchanges its distinct polling secret and stores the issued credential in Windows. Ten approvals per signed-in identity per minute.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserPairingApproval' }
      responses:
        '200': { description: 'Approved request without device credential; no-store' }
        '403': { description: 'Web session, CSRF or explicit capture consent missing' }
        '410': { description: 'Unknown, expired or already approved request' }
  /moderation/matches:
    get:
      operationId: listModerationMatches
      summary: List persisted matches for an active moderator
      description: No-store. Uses current persisted account status and role. Newest first by createdAt and UUID descending, with opaque keyset pagination. Disabled controlled tests are omitted; other match modes remain visible. Summary includes declared players and usable independent reports per team, without raw reports, account IDs, assignment codes or credentials. CANCELLED is a display filter over cancelledAt; other state filters exclude cancelled matches. canCancel is true only for available controlled tests that have not been cancelled. Reading establishes the CSRF cookie for subsequent moderator commands.
      security: [{ webSession: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ALL, PENDING, REVIEW, VERIFIED, CANCELLED], default: ALL } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 256 }, description: 'Use nextCursor from the previous page with the same filter' }
      responses:
        '200':
          description: A bounded page of persisted match summaries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModerationMatchPage' }
        '400': { description: 'Invalid state, size or cursor' }
        '401': { description: 'Web login required' }
        '403': { description: 'Current active moderator required' }
  /moderation/capture-tests:
    post:
      operationId: createControlledCaptureTest
      summary: Create an individual capture or a controlled Darkspear roster test
      description: Requires an active persisted MODERATOR web account, CSRF, and RBGS_CONTROLLED_CAPTURE_ENABLED. Declared identities are unverified. No ranked match or rating is created. CAPTURE_ONLY permits exactly the authenticated moderator account and its declared character with teamKey null; no expected opponent/team is asserted. ROSTER_CONTROLLED (the default) requires at least one active reporter and both assigned teams. Full names must be unique after NFC normalization, trimming and case folding. Controlled roster results can be verified with six concordant accounts per team and no essential contradictions. CAPTURE_ONLY remains unverifiable. Ten requests per moderator per minute.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [armMinutes, roster]
              properties:
                armMinutes: { type: integer, minimum: 5, maximum: 120 }
                testKind: { type: string, enum: [ROSTER_CONTROLLED, CAPTURE_ONLY], default: ROSTER_CONTROLLED }
                roster:
                  type: array
                  minItems: 1
                  maxItems: 40
                  items:
                    type: object
                    additionalProperties: false
                    required: [accountId, character, teamKey]
                    properties:
                      accountId: { type: [string, 'null'], format: uuid }
                      character: { $ref: '#/components/schemas/CaptureIdentity' }
                      teamKey: { type: [string, 'null'], enum: [A, B, null] }
              allOf:
                - if:
                    required: [testKind]
                    properties:
                      testKind: { const: CAPTURE_ONLY }
                  then:
                    properties:
                      roster:
                        minItems: 1
                        maxItems: 1
                        items:
                          properties:
                            accountId: { type: string, format: uuid }
                            teamKey: { type: 'null' }
                  else:
                    properties:
                      roster:
                        minItems: 2
                        items:
                          properties:
                            teamKey: { type: string, enum: [A, B] }
      responses:
        '200': { description: "Test match ID, CONTROLLED_TEST mode, testKind, armUntil and per-account assignmentId/captureId; no plaintext code" }
        '401': { description: "Web login required" }
        '403': { description: "Active moderator and CSRF required" }
        '422': { description: "Invalid or unsupported roster" }
        '429': { description: "Retry-After 60 seconds" }
        '503': { description: "Controlled capture testing disabled" }
  /moderation/capture-tests/{id}/cancel:
    post:
      operationId: cancelControlledCaptureTest
      description: Requires current active moderator and CSRF. Only CONTROLLED_TEST matches can be cancelled. Optional expectedVersion rejects stale state with 409. An already-cancelled test returns 204 idempotently, including a repeated request with an older version. Original reports and prior result audit remain stored. Legacy callers may omit the version.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: expectedVersion, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '204': { description: "Cancelled; committed evidence retained" }
        '400': { description: 'Invalid expected version' }
        '403': { description: "Active moderator and CSRF required" }
        '404': { description: "Test not found" }
        '409': { description: 'Match changed; refresh before cancelling' }
        '503': { description: "Controlled testing disabled" }
  /companion/assignments:
    get:
      operationId: listOwnCaptureAssignments
      description: Native bearer with companion:assignments; web cookies are ignored. At most 50 own assignments, newest first, with character, armUntil, codeIssued and cancelled. Controlled assignments retain their existing testKind field. When controlled testing is disabled, controlled assignments are omitted; other match assignments remain available. No codes or other accounts. No-store; 120 reads per account per minute.
      security: [{ deviceCredential: [] }]
      responses:
        '200': { description: "Own controlled assignment summaries" }
        '401': { description: "Missing, expired or revoked device" }
        '403': { description: "Re-pair with explicit capture permissions" }
        '503': { description: "Controlled testing disabled" }
  /matches/{id}/result:
    get:
      operationId: getMatchResult
      summary: Read a match result as a participant or active moderator
      description: No-store. Returns only result, independent reporting coverage and server deadline, without raw reports or account identities. PENDING awaits reports; VERIFIED requires six accounts from each assigned team; REVIEW has no canonical outcome. Exact roster, full observed identity, bijective team mapping, known map, plausible timing and all historical report revisions are compared. Optional statistics are retained per report and never selected as canonical. The deadline is 15 minutes after the first usable final report; without a usable final report the test expires four hours and 15 minutes after armUntil. Incomplete captures do not start the final-report timer. Match mode records CONTROLLED_TEST or MATCHMADE independently of the evidence policy. The test feature flag only gates CONTROLLED_TEST matches. MATCHMADE is an internal model foundation; no matchmaking creation endpoint or ranked activation is provided. A result is not Blizzard ownership or a rating movement.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Persisted result; background processing can update this snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '401': { description: "Web login required" }
        '403': { description: "Inactive account" }
        '404': { description: "No visible test" }
        '503': { description: "Controlled testing disabled" }
  /moderation/matches/{id}/verification:
    get:
      operationId: inspectMatchVerification
      summary: Inspect assigned roster, report validation, normalized facts and result audit history
      description: Requires a current active MODERATOR web account. No-store. Each private report includes evidenceId, accountId, revision, receivedAt, validation, reason, normalizedFacts (JSON string or null) and redactedPayload (JSON string). Codes remain hashed. Events preserve prior verification and late-review transitions with immutable evidence IDs and policy version. No decision or rating mutation is performed by this route.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private verification details
          content:
            application/json:
              schema:
                type: object
                required: [result, expectedRoster, reports, events]
                properties:
                  result: { $ref: '#/components/schemas/MatchResult' }
                  expectedRoster: { type: array, items: { type: object } }
                  reports: { type: array, items: { type: object } }
                  events: { type: array, items: { type: object } }
        '401': { description: "Web login required" }
        '403': { description: "Active moderator required" }
        '404': { description: "No test" }
        '503': { description: "Controlled testing disabled" }
  /capture-tests/{id}/result:
    get:
      deprecated: true
      operationId: getCaptureTestResult
      summary: Compatibility alias for GET /matches/{id}/result
      description: No-store. Returns only result, independent reporting coverage and server deadline, without raw reports or account identities. PENDING awaits reports; VERIFIED requires six accounts from each assigned team; REVIEW has no canonical outcome. Exact roster, full observed identity, bijective team mapping, known map, plausible timing and all historical report revisions are compared. Optional statistics are retained per report and never selected as canonical. The deadline is 15 minutes after the first usable final report; without a usable final report the test expires four hours and 15 minutes after armUntil. Incomplete captures do not start the final-report timer. This is a non-ranked controlled result, not Blizzard ownership or a rating movement.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Persisted result; background processing can update this snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '401': { description: "Web login required" }
        '403': { description: "Inactive account" }
        '404': { description: "No visible test" }
        '503': { description: "Controlled testing disabled" }
  /moderation/capture-tests/{id}/verification:
    get:
      deprecated: true
      operationId: inspectCaptureVerification
      summary: Compatibility alias for GET /moderation/matches/{id}/verification
      description: Requires a current active MODERATOR web account. No-store. Each private report includes evidenceId, accountId, revision, receivedAt, validation, reason, normalizedFacts (JSON string or null) and redactedPayload (JSON string). Codes remain hashed. Events preserve prior verification and late-review transitions with immutable evidence IDs and policy version. No decision or rating mutation is performed by this route.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Private verification details
          content:
            application/json:
              schema:
                type: object
                required: [result, expectedRoster, reports, events]
                properties:
                  result: { $ref: '#/components/schemas/MatchResult' }
                  expectedRoster: { type: array, items: { type: object } }
                  reports: { type: array, items: { type: object } }
                  events: { type: array, items: { type: object } }
        '401': { description: "Web login required" }
        '403': { description: "Active moderator required" }
        '404': { description: "No test" }
        '503': { description: "Controlled testing disabled" }
  /companion/assignments/{captureId}/result:
    get:
      operationId: getOwnCaptureTestResult
      description: Requires companion:assignments. Own account-bound controlled result, no-store. Ignores web cookies. Does not expose private reports or replace durable receipt recovery. At most 120 assignment/receipt reads per account per minute.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Own controlled test result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '401': { description: "Missing, expired or revoked device" }
        '403': { description: "Capture permissions required" }
        '404': { description: "No own assignment" }
        '503': { description: "Controlled testing disabled" }
  /companion/assignments/{captureId}:
    get:
      operationId: getOwnCaptureAssignment
      description: Requires companion:assignments. Frozen schema-2 descriptor contains match/assignment/capture UUIDs, assignedCharacterId, assignedTeamKey A/B, rosterVersion 1, mode CONTROLLED_TEST, expectedMapProfile DARKSPEAR_DIAGNOSTIC, expectedRoster, issuedAt, armUntil and assignmentCodeSha256. CAPTURE_ONLY descriptors additionally carry testKind CAPTURE_ONLY, assignedTeamKey null and exactly one expectedRoster row containing only the declared own character with assignedTeamKey null. This row is a reporter declaration, not an expected game roster. Legacy roster descriptors keep their original shape. Older companions reject the new variant safely and must be updated before issuing a capture-only code. Never returns the plaintext code. Readable after expiry/cancellation for evidence recovery.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "Frozen own assignment descriptor; no-store" }
        '404': { description: "No own assignment" }
        '409': { description: "Code not issued" }
  /companion/assignments/{captureId}/issue:
    post:
      operationId: issueOwnCaptureCode
      description: Requires companion:assignments. Once only, before armUntil, while not cancelled. Returns assignment descriptor and assignmentCode (16 uppercase Crockford characters). Server persists only its SHA-256. A lost issuance requires a fresh assignment unless the addon or this PC already has the code. For CAPTURE_ONLY, the native caller must advertise X-RBGS-Capture-Test-Kinds CAPTURE_ONLY. An unsupported caller receives 409 before any code is consumed. Legacy roster issuance needs no capability header. Ten requests per account per minute; no-store.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: header, name: X-RBGS-Capture-Test-Kinds, required: false, schema: { type: string, enum: [CAPTURE_ONLY] } }
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "Own plaintext code issued once" }
        '404': { description: "No own assignment" }
        '409': { description: "Code already issued or companion does not support individual capture tests; unsupported capability does not consume the code" }
        '410': { description: "Cancelled or arming window expired" }
  /evidence:
    post:
      operationId: storeCaptureEvidence
      description: Native bearer evidence:write only; no web cookie authorization. Strict schema 2, at most 256 KiB, 40 score rows, depth 30, duplicate JSON keys rejected. Root requires schemaVersion, matchId, assignmentId, captureId, captureRevision, assignmentCode, client, observedCharacter, capture. Only wow_classic_beta with the darkspear-scoreboard-v1 adapter or its legacy darkspear-70338-test-1 identifier is accepted. Game version, build and positive interface are retained as bounded metadata rather than patch allowlists; the supported map and data shape remain enforced. Nullable Lua members must become explicit JSON null. Canonical UTF-8 uses sorted object keys, ordered arrays and nonnegative safe integers. Identity/stats remain observations. Idempotency key is account/assignment/capture/revision; different canonical content returns 409. Evidence and processing job commit before receipt. Stored report replaces plaintext assignmentCode with assignmentCodeSha256, preserving other members; submitted/stored hashes are separate. For compatibility the receipt processingStatus still advances from PENDING to REVIEW after processing; authoritative match verification is exposed separately by the result routes. Delayed uploads are evaluated against assignment and game timing, never upload expiry alone; cancelled reports remain review evidence. No rating is applied. Sixty writes per account per minute.
      security: [{ deviceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaVersion, matchId, assignmentId, captureId, captureRevision, assignmentCode, client, observedCharacter, capture]
              additionalProperties: false
              properties:
                schemaVersion: { type: integer, const: 2 }
                matchId: { type: string, format: uuid }
                assignmentId: { type: string, format: uuid }
                captureId: { type: string, format: uuid }
                captureRevision: { type: integer, minimum: 1, maximum: 2147483647 }
                assignmentCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{16}$' }
                client: { type: object, description: "Exact addonVersion, adapterVersion, product, gameVersion, gameBuild, interface and companionVersion members" }
                observedCharacter: { $ref: '#/components/schemas/CaptureIdentity' }
                capture: { type: object, description: "Exact state, stage, continuity, incompleteReason, map, startedAt, endedAt, roster and outcome members; COMPLETE requires continuous final data on map 2997" }
      responses:
        '200':
          description: Durable receipt; storage does not imply match verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureReceipt' }
        '401': { description: "Missing, expired or revoked device" }
        '403': { description: "Missing scope or incorrect own assignment/code binding" }
        '404': { description: "No own assignment" }
        '409': { description: "Different content under existing revision" }
        '413': { description: "Body exceeds 256 KiB" }
        '415': { description: "JSON required" }
        '422': { description: "Invalid or unsupported capture" }
        '429': { description: "Retry-After 60 seconds" }
        '503': { description: "Controlled testing disabled" }
  /evidence/receipts/{assignmentId}/{captureId}/{revision}:
    get:
      operationId: recoverOwnCaptureReceipt
      description: Requires evidence:write. Own account-bound receipt recovery after response loss or restart; no-store. Verify IDs, revision, durablyStored and contentSha256 before marking local ACKNOWLEDGED. Processing status may advance from PENDING to REVIEW.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: revision, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      responses:
        '200':
          description: Previously committed receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureReceipt' }
        '404': { description: "No own stored receipt" }
  /device-pairings:
    post:
      operationId: startDevicePairing
      summary: Create a five-minute desktop pairing request
      description: Stateless; ignores web cookies. Returns a visible approval code and separate secret polling credential. No-store. Limited to five creations per peer IP per minute on this single API instance. Secrets must not be logged or placed in URLs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: ['companion:status', 'companion:status companion:assignments evidence:write'], default: 'companion:status' }
      responses:
        '200':
          description: Pending pairing; neither value authenticates a device yet
          content:
            application/json:
              schema:
                type: object
                required: [code, pollingSecret, expiresAt, intervalSeconds, approvalSecret]
                properties:
                  code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{10}$' }
                  pollingSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  expiresAt: { type: string, format: date-time }
                  intervalSeconds: { type: integer, const: 5 }
                  approvalSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'Short-lived browser approval handle; cannot exchange a device credential' }
        '400': { description: "Invalid scope" }
        '429': { description: "Rate limited; Retry-After is 60 seconds" }
  /device-pairings/approve:
    post:
      operationId: approveDevicePairing
      summary: Approve a code for the current active Battle.net account
      description: Requires web session and X-XSRF-TOKEN. Approve only a code from your own companion. Approval is single-use and does not extend expiry. Limited to ten attempts per signed-in identity per minute. Approval never returns polling secrets or device tokens.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{10}$' }
                acceptCapturePermissions: { type: boolean, default: false, description: "Must be true when approving a capture-scoped request" }
      responses:
        '204': { description: "Approved; companion must exchange its polling secret" }
        '400': { description: "Invalid code format" }
        '401': { description: "No web session" }
        '403': { description: "Inactive account or invalid CSRF" }
        '410': { description: "Unknown, expired, approved or consumed code" }
        '429': { description: "Rate limited; Retry-After is 60 seconds" }
  /device-pairings/token:
    post:
      operationId: exchangeDevicePairing
      summary: Poll approval and exchange once for a device credential
      description: Stateless and no-store. Poll at most once every five seconds. Approved requests are locked transactionally; concurrent exchanges yield one device. Five active devices per account. PAIRED issues a 90-day opaque credential with the approved requested scope; existing credentials remain status-only. A lost successful response requires a new pairing. Device credentials cannot authenticate web commands.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pollingSecret]
              properties:
                pollingSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200':
          description: Pending approval or a single issued credential
          content:
            application/json:
              schema:
                type: object
                required: [status, token, deviceId, expiresAt, scope]
                properties:
                  status: { type: string, enum: [PENDING, PAIRED] }
                  token: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{43}$' }
                  deviceId: { type: [string, 'null'], format: uuid }
                  expiresAt: { type: [string, 'null'], format: date-time }
                  scope: { type: [string, 'null'], enum: [null, 'companion:status', 'companion:status companion:assignments evidence:write'] }
        '400': { description: "Invalid polling credential format" }
        '409': { description: "Active device limit reached; revoke a device" }
        '410': { description: "Unknown, expired, consumed pairing or inactive account" }
        '429': { description: "Rate limited; Retry-After is 60 seconds" }
  /devices/me:
    get:
      operationId: listMyDevices
      summary: List this account's devices without credentials
      description: Requires current active web account. Establishes CSRF cookie; no-store. Returns only devices with unrevoked, unexpired access that have not been removed from the listing. Revoked and expired registrations are retained internally for historical references and disappear automatically from this response. A valid offline device remains listed; paired does not mean currently connected or in-game.
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Own devices with valid access, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { description: "No web session" }
        '403': { description: "Inactive account" }
  /devices/{id}/record:
    delete:
      operationId: removeInactiveDeviceFromList
      deprecated: true
      summary: Remove an own revoked or expired device from the visible list
      description: Active web session and X-XSRF-TOKEN required. Server checks account ownership and locks the device. Only revoked or expired devices may be removed; an offline device with valid access must first be revoked. Repeated removal is idempotent. V16 records removed_at and excludes the device from devices/me while preserving credential history, pairing links and capture evidence references. This never grants or restores device access.
      security: [{ webSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Removed from the list; no-store' }
        '401': { description: 'Web session required; device bearer cannot substitute it' }
        '403': { description: 'Inactive account or missing/invalid CSRF' }
        '404': { description: 'Unknown device or belongs to another account' }
        '409': { description: 'Device access remains active; revoke first' }
  /devices/{id}:
    delete:
      operationId: revokeMyDevice
      summary: Revoke an owned device immediately
      description: Requires current active web account and X-XSRF-TOKEN. Repeating revocation succeeds. No-store.
      security: [{ webSession: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: "Revoked" }
        '401': { description: "No web session" }
        '403': { description: "Inactive account or invalid CSRF" }
        '404': { description: "Device missing or owned by another account" }
  /companion/status:
    get:
      operationId: getCompanionConnection
      summary: Verify scoped device connectivity authorization
      description: Stateless bearer authentication; web cookies cannot substitute a credential. Reads current device expiry/revocation and persisted account status on every request. No-store. Does not establish addon freshness, game participation, readiness or match eligibility.
      security: [{ deviceCredential: [] }]
      responses:
        '200':
          description: Authorized account-bound device
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, accountId, scope, accountName]
                properties:
                  deviceId: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  accountName: { type: string, maxLength: 100, description: "Current display name of the authenticated Battle.net account; display only, not an identity key." }
                  scope: { type: string, enum: ['companion:status', 'companion:status companion:assignments evidence:write'] }
        '401': { description: "Missing, invalid, expired or revoked device credential or inactive account" }
  /play/context:
    get:
      operationId: getPlaySelectionContext
      summary: Get the authenticated account's configured season and saved selection
      description: Requires a current active account. Establishes the CSRF cookie. Cache-Control is no-store. No configured season returns season and selection as null. Ownership verification is currently UNVERIFIED and matchmakingAvailable is always false; Classic data cannot authorize selection.
      responses:
        '200':
          description: Selection context; no queue eligibility is implied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaySelectionContext' }
        '401': { description: "No Battle.net session" }
        '403': { description: "Missing or inactive account" }
        '503': { description: "Configured season does not exist" }
  /me/selection:
    put:
      operationId: saveSeasonSelection
      summary: Persist the authenticated account's character declaration or verified reference
      description: Requires X-XSRF-TOKEN and a current active account. Account identity is derived from the session. companionDeviceId must identify a linked device owned by that account which is neither revoked nor expired; the server rechecks this under a device lock before persisting. Recent heartbeat and capture permissions are separate from this linkage prerequisite. Send expectedVersion null for first creation and the returned version thereafter, plus the current seasonVersion. ACCOUNT mode requires declaration and no characterId; CHARACTER mode requires characterId and no declaration, associated Forever identity and explicit authenticated ownership verification. The production Forever verifier currently rejects verification with 503. Saving never opens a season or enables matchmaking. Cache-Control is no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonSelectionRequest' }
      responses:
        '200':
          description: Saved selection and its version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonSelection' }
        '400': { description: "Invalid declaration, role, mode or character reference, or missing/malformed companionDeviceId" }
        '401': { description: "No Battle.net session" }
        '403': { description: "Missing or inactive account or invalid CSRF token" }
        '409': { description: "No configured season or stale selection or season version; fetch context before retrying" }
        '412': { description: "Selected companion is missing, belongs to another account, is revoked or has expired" }
        '503': { description: "Configured season missing or authenticated Forever verification unavailable" }
  /email-notifications/feedback/resend:
    post:
      operationId: receiveResendFeedback
      summary: Receive signed Resend delivery feedback
      description: Verifies the raw body with Svix before processing delivery, permanent bounce and complaint events. Requires a configured webhook secret.
      security: []
      parameters:
        - in: header
          name: svix-id
          required: true
          schema: {type: string}
        - in: header
          name: svix-timestamp
          required: true
          schema: {type: string}
        - in: header
          name: svix-signature
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '204':
          description: Verified event processed or ignored
        '400':
          description: Invalid event payload
        '403':
          description: Invalid or expired signature
        '413':
          description: Payload exceeds 256 KiB
        '503':
          description: Webhook secret not configured

  /email-notifications/feedback:
    post:
      operationId: receiveSesFeedback
      summary: Receive signed Amazon SNS bounce and complaint notifications
      description: AWS-only webhook. No session or CSRF token; the complete SNS envelope signature, expected topic ARN and source account are verified before processing. Raw message delivery must be disabled. Subscription confirmation is automatic for the configured topic. Repeated SNS message IDs are idempotent. Maximum request body is 256 KiB.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, description: "Signed SNS JSON envelope" }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: "Subscription confirmed or feedback durably processed" }
        '400': { description: "Invalid SNS or SES payload" }
        '403': { description: "Untrusted topic, certificate URL or signature" }
        '409': { description: "Feedback subscription was removed" }
        '413': { description: "Payload too large" }
        '503': { description: "Feedback not configured or temporary AWS connection failure" }
  /season-notifications:
    get:
      operationId: getSeasonNotificationStatus
      summary: Get launch state and establish an anonymous CSRF cookie
      responses:
        '200':
          description: Notification state, without provider credentials
          content:
            application/json:
              schema:
                type: object
                required: [emailEnabled, seasonLive, subscriptionsAvailable]
                properties:
                  emailEnabled: { type: boolean }
                  seasonLive: { type: boolean }
                  subscriptionsAvailable: { type: boolean }
    post:
      operationId: subscribeToSeasonLaunch
      summary: Request one launch notification, without a Battle.net account
      description: Requires X-XSRF-TOKEN from the XSRF-TOKEN cookie. The website field is a honeypot and must be empty. Repeated and already-confirmed addresses receive the same generic response. Confirmation links expire after 48 hours; re-requests are limited to one per address per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, language]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                language: { type: string, enum: [en, es, fr] }
                website: { type: string, maxLength: 200, default: '' }
      responses:
        '202': { description: "Request accepted; confirmation may be queued if required" }
        '400': { description: "Invalid email or locale" }
        '403': { description: "Missing or invalid CSRF token" }
        '409': { description: "Season already started" }
        '429': { description: "Too many requests" }
        '503': { description: "Email delivery has not been configured" }
  /season-notifications/confirm:
    post:
      operationId: confirmSeasonNotification
      summary: Confirm an email using a bearer token and a deliberate user action
      description: Requires X-XSRF-TOKEN. Does not require Battle.net. An already-confirmed active token succeeds idempotently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonNotificationLink' }
      responses:
        '204': { description: "Email confirmed" }
        '400': { description: "Invalid, expired or cancelled confirmation" }
        '403': { description: "Missing or invalid CSRF token" }
        '429': { description: "Too many requests" }
  /season-notifications/unsubscribe:
    post:
      operationId: cancelSeasonNotification
      summary: Cancel a notification using a bearer token and a deliberate user action
      description: Requires X-XSRF-TOKEN. Repeated cancellation succeeds idempotently. An email already in flight may complete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonNotificationLink' }
      responses:
        '204': { description: "Notification cancelled" }
        '400': { description: "Invalid token" }
        '403': { description: "Missing or invalid CSRF token" }
        '429': { description: "Too many requests" }
  /moderation/season-notifications:
    get:
      operationId: getSeasonNotificationConfiguration
      summary: Moderator-only launch and configuration flags
      responses:
        '200':
          description: Non-secret configuration state
          content:
            application/json:
              schema:
                type: object
                required: [configured, seasonLive]
                properties:
                  configured: { type: boolean }
                  seasonLive: { type: boolean }
        '401': { description: "Missing authenticated session" }
        '403': { description: "Active account and current persisted moderator role required" }
  /moderation/season-notifications/launch:
    post:
      operationId: queueSeasonLaunchNotifications
      summary: Moderator-only manual launch campaign
      description: Requires X-XSRF-TOKEN, a moderator session and the server season-live flag. Operators must verify ranked play is available first. Repeating the request queues no duplicates. Counts queued messages, not delivered inboxes.
      responses:
        '200':
          description: Campaign queued durably
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer, minimum: 0 }
        '401': { description: "Missing authenticated session" }
        '403': { description: "Active account, current persisted moderator role or valid CSRF token required" }
        '409': { description: "Season-live flag is disabled" }
        '503': { description: "Email delivery has not been configured" }
  /characters/me:
    get:
      operationId: getCurrentUserCharacters
      summary: Get the authenticated user's WoW Classic characters of level 60 or above in EU and North America
      description: Requires a Battle.net session with wow.profile permission. Queries profile-classic1x-eu and profile-classic-eu on eu.api.blizzard.com with en_GB, and profile-classic1x-us and profile-classic-us on us.api.blizzard.com with en_US, using the user's token. Merges Classic branches within each regional WoW account and returns characters of level 60 or above with their source namespace. Regional account IDs may coincide; use the namespace with account, realm and character IDs for identity. A missing profile (404) in one region or branch does not hide the others; other provider failures are surfaced rather than silently returning a partial list. Never returns tokens or persists character associations.
      responses:
        '200':
          description: WoW accounts and their owned characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WowAccountProfile'
        '401':
          description: Missing session or expired Battle.net token; sign in again
        '403':
          description: Suspended or missing rbgs.io account, missing wow.profile permission or Blizzard profile privacy restriction
        '404':
          description: None of the Classic branches in EU or North America has an accessible profile
        '502':
          description: Blizzard unavailable or returned an invalid response
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current rbgs.io account and establish a CSRF cookie
      description: Returns no content when the browser has no authenticated session. Existing sessions must belong to an active persisted account; status and moderator permissions are checked on each protected request. Never returns provider tokens.
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '204':
          description: No authenticated session
        '403':
          description: Session belongs to a suspended or missing account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the browser session
      description: Requires the X-XSRF-TOKEN header copied from the XSRF-TOKEN cookie.
      responses:
        '204':
          description: Session invalidated
        '403':
          description: Missing or invalid CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health:
    get:
      operationId: getHealth
      summary: Check API process liveness
      description: Does not check PostgreSQL or ranked-play availability. Use readiness for dependency availability.
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readiness:
    get:
      operationId: getReadiness
      summary: Check API database readiness
      description: Public uncached dependency check using the internal PostgreSQL health contributor. Returns only a status, without database details. Does not establish Blizzard availability, character ownership, ranked readiness or measured capacity.
      responses:
        '200':
          description: PostgreSQL health is UP
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ready }
        '503':
          description: PostgreSQL health is unavailable, unknown or missing
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: unavailable }
components:
  securitySchemes:
    webSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Battle.net web session; mutations also require X-XSRF-TOKEN.
    deviceCredential:
      type: http
      scheme: bearer
      description: Opaque account-bound rbgs.io device token, not a Battle.net token.
  schemas:
    BrowserPairingApproval:
      type: object
      required: [approvalSecret]
      properties:
        approvalSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        acceptCapturePermissions: { type: boolean, default: false }
    CaptureIdentity:
      type: object
      additionalProperties: false
      required: [name, realm]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        realm: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        guid: { type: [string, 'null'], minLength: 1, maxLength: 128 }
    ModerationMatchPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ModerationMatchSummary' } }
        nextCursor: { type: [string, 'null'], maxLength: 256 }
    ModerationMatchSummary:
      type: object
      additionalProperties: false
      required: [matchId, mode, evidencePolicy, profile, createdAt, captureStartDeadline, cancelledAt, roster, result, canCancel]
      properties:
        matchId: { type: string, format: uuid }
        mode: { type: string, enum: [CONTROLLED_TEST, MATCHMADE] }
        evidencePolicy: { type: string, enum: [FULL_ROSTER, CAPTURE_ONLY] }
        profile: { type: string }
        createdAt: { type: string, format: date-time }
        captureStartDeadline: { type: string, format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        roster:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [name, realm, team]
            properties:
              name: { type: string, maxLength: 128 }
              realm: { type: [string, 'null'], maxLength: 128 }
              team: { type: [string, 'null'], enum: [A, B, null] }
        result: { $ref: '#/components/schemas/MatchResult' }
        canCancel: { type: boolean }
    MatchResult:
      type: object
      additionalProperties: false
      required: [matchId, mode, status, reason, outcome, winningTeam, reportsA, reportsB, requiredPerTeam, deadline, version, policyVersion, ratingApplied]
      properties:
        matchId: { type: string, format: uuid }
        mode: { type: string, enum: [CONTROLLED_TEST, MATCHMADE] }
        status: { type: string, enum: [PENDING, VERIFIED, REVIEW] }
        reason: { type: [string, 'null'] }
        outcome: { type: [string, 'null'], enum: [WIN, DRAW, null] }
        winningTeam: { type: [string, 'null'], enum: [A, B, null] }
        reportsA: { type: integer, minimum: 0, description: 'Distinct assigned accounts with valid observations, including conflicting votes when under review' }
        reportsB: { type: integer, minimum: 0 }
        requiredPerTeam: { type: integer, const: 6 }
        deadline: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        policyVersion: { type: string, const: controlled-roster-v1 }
        ratingApplied: { type: boolean, const: false }
    CaptureTestResult:
      deprecated: true
      allOf:
        - { $ref: '#/components/schemas/MatchResult' }
    CaptureReceipt:
      type: object
      additionalProperties: false
      required: [schemaVersion, evidenceId, assignmentId, captureId, captureRevision, receivedAt, durablyStored, processingStatus, contentSha256]
      properties:
        schemaVersion: { type: integer, const: 2 }
        evidenceId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        captureId: { type: string, format: uuid }
        captureRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        receivedAt: { type: string, format: date-time }
        durablyStored: { type: boolean, const: true }
        processingStatus: { type: string, enum: [PENDING, REVIEW] }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Device:
      type: object
      required: [id, createdAt, expiresAt, revokedAt, scope, lastSeenAt, connected]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time, description: 'Latest authenticated native heartbeat at server time' }
        connected: { type: boolean, description: 'Recent signal from this device; not game participation or physical browser co-location' }
        scope: { type: string, enum: ['companion:status', 'companion:status companion:assignments evidence:write'] }
    PlaySelectionContext:
      type: object
      required: [season, selection, ownershipVerification, matchmakingAvailable]
      properties:
        season:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SelectionSeason' }
        selection:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SeasonSelection' }
        ownershipVerification: { type: string, const: UNVERIFIED }
        matchmakingAvailable: { type: boolean, const: false }
    SelectionSeason:
      type: object
      required: [id, name, kind, ratingSubjectType, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [BETA, PUBLIC] }
        ratingSubjectType: { type: string, enum: [ACCOUNT, CHARACTER] }
        version: { type: integer, format: int64, minimum: 0 }
    SeasonSelectionRequest:
      type: object
      required: [seasonId, seasonVersion, role, captainConsent, companionDeviceId]
      properties:
        seasonId: { type: string, format: uuid }
        seasonVersion: { type: integer, format: int64, minimum: 0 }
        companionDeviceId: { type: string, format: uuid, description: "Selected linked companion device belonging to the authenticated account; must not be revoked or expired" }
        expectedVersion: { type: [integer, 'null'], format: int64, minimum: 0, description: "Null for first creation; saved version for replacement" }
        characterId: { type: [string, 'null'], format: uuid }
        declaration:
          type: [object, 'null']
          required: [name, realm]
          properties:
            name: { type: string, minLength: 1, maxLength: 100, description: "Nonblank text without control characters" }
            realm: { type: string, minLength: 1, maxLength: 100, description: "Provisional declaration uses the selected Classic character realm; not verified Forever ownership" }
        role: { type: string, enum: [FC, HEALER, DPS] }
        captainConsent: { type: boolean }
    SeasonSelection:
      type: object
      required: [characterId, name, realm, source, ratingSubjectType, ratingSubjectId, role, captainConsent, version, validForSeason]
      properties:
        characterId: { type: string, format: uuid, description: "Internal identity; not a Blizzard ID or a game GUID" }
        name: { type: string }
        realm: { type: string }
        source: { type: string, enum: [DECLARED, BLIZZARD_VERIFIED] }
        ratingSubjectType: { type: string, enum: [ACCOUNT, CHARACTER] }
        ratingSubjectId: { type: string, format: uuid, description: "Prospective account or character subject; no rating record is created" }
        role: { type: string, enum: [FC, HEALER, DPS] }
        captainConsent: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
        validForSeason: { type: boolean, description: "Stored mode/provenance match the current season; not proof of fresh ownership, setup readiness or queue eligibility" }
    SeasonNotificationLink:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    WowAccountProfile:
      type: object
      required: [wow_accounts]
      properties:
        wow_accounts:
          type: array
          items:
            type: object
            required: [id, characters]
            properties:
              id:
                type: integer
                format: int64
              characters:
                type: array
                items:
                  $ref: '#/components/schemas/WowCharacter'
    WowCharacter:
      type: object
      required: [namespace]
      properties:
        gender:
          anyOf:
            - $ref: '#/components/schemas/WowNamedReference'
            - type: 'null'
          description: Character gender from Blizzard (type MALE or FEMALE); null when unavailable.
        guild:
          anyOf:
            - $ref: '#/components/schemas/WowNamedReference'
            - type: 'null'
          description: Optional guild from the character profile; null when unguilded or unavailable.
        namespace:
          type: string
          enum: [profile-classic1x-eu, profile-classic-eu, profile-classic1x-us, profile-classic-us]
          description: Source Classic branch and region; part of the character's identity alongside account, realm and character IDs. The web displays us as NA.
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: Optional Blizzard portrait; null when character media is unavailable.
        insetUrl:
          type: [string, 'null']
          format: uri
          description: Optional wider Blizzard portrait; null when not provided.
        id:
          type: integer
          format: int64
        name:
          type: string
        level:
          type: integer
          minimum: 60
        realm:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            slug:
              type: string
        playable_class:
          $ref: '#/components/schemas/WowNamedReference'
        playable_race:
          $ref: '#/components/schemas/WowNamedReference'
        faction:
          $ref: '#/components/schemas/WowNamedReference'
    WowNamedReference:
      type: object
      properties:
        id:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        type:
          type: [string, 'null']
    Profile:
      type: object
      required: [id, displayName, region, role]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        region:
          type: string
          const: EU
        role:
          type: string
          enum: [USER, MODERATOR]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
