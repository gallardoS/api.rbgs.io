        '401': { description: Battle.net login expired or unavailable }
        '403': { description: Active moderator and wow.profile access required }
        '404': { description: No accessible Anniversary account profile in EU or NA }
        '502': { description: Invalid or unavailable Blizzard response; no Classic fallback }
        '503': { description: Controlled testing disabled or character loader busy }
        '504': { description: Blizzard ownership query timed out }
