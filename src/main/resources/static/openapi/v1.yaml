    post:
      operationId: decideMatchResult
      summary: Resolve or void a match with immutable moderator audit history
      description: Requires an active persisted moderator, web session and CSRF. Locks the shared match and requires its current result version. WIN and DRAW require nonempty selected evidence IDs from this match, each revalidated against the selected outcome and assigned teams; no automatic quorum is required for a human decision. CAPTURE_ONLY can only be voided. VOID accepts optional evidence references. Pending processing or cancellation returns 409. New reports reopen review and preserve the decision. A new correction decision appends history with correctionRequired for a future rating workflow; no rating is applied. The participant result routes expose the explanation, never the moderator identity or evidence references.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-XSRF-TOKEN, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeratorDecision' }
      responses:
        '200':
          description: Persisted result with the incremented version; no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchResult' }
        '400': { description: 'Invalid reason, outcome, team or evidence references; unsupported outcome' }
        '401': { description: 'Web login required' }
        '403': { description: 'Current active moderator and CSRF required' }
        '404': { description: 'Unknown or unavailable match' }
