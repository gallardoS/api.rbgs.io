openapi: 3.1.0
info:
  title: rbgs.io API
  version: 1.0.0
  description: Foundation, Battle.net sessions, character profiles and season launch notifications. Other product endpoints are added with their owning features.
servers:
  - url: /api/v1
paths:
  /local/premade/reset:
    post:
      operationId: resetPremadeLab
      security: [{ soloQueueLabSession: [] }]
      summary: Replace only the premade simulation generation
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      responses:
        '200':
          description: No-store updated simulation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabSetup' }
        '403': { description: Missing lab CSRF or captain authorization }
        '404': { description: Actor, group or room unavailable }
        '409': { description: Command conflicts with current state }
  /local/premade/actor:
    post:
      operationId: selectPremadeLabActor
      security: [{ soloQueueLabSession: [] }]
      summary: Choose a synthetic player for this session
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accountId], properties: { accountId: { type: string, format: uuid } } }
      responses:
        '200':
          description: No-store updated simulation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabSetup' }
        '403': { description: Missing lab CSRF or captain authorization }
        '404': { description: Actor, group or room unavailable }
        '409': { description: Command conflicts with current state }
  /local/premade/captain:
    post:
      operationId: transferPremadeLabCaptain
      security: [{ soloQueueLabSession: [] }]
      summary: Change captain within the selected synthetic group
      description: Current captain and lab CSRF required. A waiting search is cancelled transactionally with LOBBY_CHANGED and is never automatically requeued. Proposed/preparing rooms freeze the roster and captain until declined or ended.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accountId], properties: { accountId: { type: string, format: uuid } } }
      responses:
        '200':
          description: No-store updated simulation status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '403': { description: Not the current captain or missing CSRF }
        '404': { description: Synthetic actor unavailable }
        '409': { description: Invalid target or a match proposal/preparation holds the roster }
  /local/premade/opponents:
    post:
      operationId: addPremadeLabOpponents
      security: [{ soloQueueLabSession: [] }]
      summary: Queue one or nine other synthetic groups
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [count], properties: { count: { type: integer, enum: [1, 9] } } }
      responses:
        '200':
          description: No-store updated simulation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '403': { description: Missing lab CSRF or captain authorization }
        '404': { description: Actor, group or room unavailable }
        '409': { description: Command conflicts with current state }
  /local/premade/rooms/{room}/response:
    post:
      operationId: respondPremadeLabRoom
      security: [{ soloQueueLabSession: [] }]
      summary: Accept or decline individually; decline also ends preparation
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      parameters:
        - { name: room, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accept], properties: { accept: { type: boolean } } }
      responses:
        '200':
          description: No-store updated simulation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '403': { description: Missing lab CSRF or captain authorization }
        '404': { description: Actor, group or room unavailable }
        '409': { description: Command conflicts with current state }
  /local/premade/rooms/{room}/test-acceptances:
    post:
      operationId: acceptPremadeLabPeers
      security: [{ soloQueueLabSession: [] }]
      summary: Simulate the other nineteen acceptances while preserving own response
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      parameters:
        - { name: room, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: No-store updated simulation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '403': { description: Missing lab CSRF or captain authorization }
        '404': { description: Actor, group or room unavailable }
        '409': { description: Command conflicts with current state }
  /local/premade/{entry}:
    delete:
      operationId: cancelPremadeLabQueue
      security: [{ soloQueueLabSession: [] }]
      summary: Captain cancels all ten waiting reservations
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      parameters:
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: No-store updated simulation state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '403': { description: Missing lab CSRF or captain authorization }
        '404': { description: Actor, group or room unavailable }
        '409': { description: Command conflicts with current state }
  /local/premade/events:
    get:
      operationId: streamPremadeLab
      security: [{ soloQueueLabSession: [] }]
      summary: Subscribe to committed simulation-state invalidations
      description: Isolated local premade lab only. Mutations require the lab CSRF token. No game assignments or ratings are created.
      responses:
        '200':
          description: No-store ready/changed/ping SSE events, with snapshot resync and polling fallback
          content:
            text/event-stream:
              schema: { type: string }
  /me/premade-queue:
    get:
      operationId: getPremadeQueue
      security: [{ webSession: [] }]
      summary: Read the caller's private premade queue and shared room
      description: No-store account-scoped snapshot. Includes current lobby/captain control and blockers. Synthetic tickets, private contact tags and hidden MMR are excluded. Eligibility is resolved per player from the configured season, owned selection, device and game proof plus persisted premade MMR. The default game gateway remains unavailable, so it does not admit real players.
      responses:
        '200':
          description: Current private queue state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeQueueStatus' }
        '401': { description: Authentication required }
    post:
      operationId: enterPremadeQueue
      security: [{ webSession: [] }]
      summary: Captain requests admission of the current complete premade
      description: Requires CSRF and the current lobby revision. No individual readiness actions or role composition apply. Admission revalidates all ten accounts under queue/group/account locks. A verified game adapter and confirmed per-season premade state are mandatory; the unavailable default gateway still returns 409 with blockers. Browser-provided eligibility or MMR is never accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PremadeQueueAdmission' }
      responses:
        '200':
          description: Group admitted atomically or the same waiting admission recovered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeQueueStatus' }
        '409':
          description: Admission unavailable or lobby revision changed
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/PremadeQueueStatus' }
                  - { $ref: '#/components/schemas/Problem' }
        '401': { description: Authentication required }
        '403': { description: Not the captain or missing CSRF }
        '404': { description: Lobby unavailable to this account }
  /me/premade-queue/{entry}:
    delete:
      operationId: cancelPremadeQueue
      security: [{ webSession: [] }]
      summary: Cancel a waiting premade entry as its captain
      description: Only the current captain may cancel a real waiting group. All ten reservations release together; proposed groups must use individual room responses. Synthetic entries are unavailable through this route.
      parameters:
        - { name: entry, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Search cancelled }
        '401': { description: Authentication required }
        '403': { description: Missing CSRF or captain authorization }
        '404': { description: No accessible real entry }
        '409': { description: Already reserved for a match or admission changed }
  /me/premade-queue/rooms/{room}/response:
    post:
      operationId: respondPremadeQueueRoom
      security: [{ webSession: [] }]
      summary: Respond individually to an own premade proposal
      description: CSRF and own-room membership required. Acceptance revalidates both groups and all player game/device/confirmed-MMR inputs. The twentieth acceptance creates and validates exactly one shared Match with twenty assignments and frozen competitive context. Adapter/roster failures roll back that acceptance and all handoff writes. Simulation rooms are inaccessible through this endpoint; the default game gateway remains unavailable.
      parameters:
        - { name: room, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accept], properties: { accept: { type: boolean } } }
      responses:
        '200':
          description: Updated private queue state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeQueueStatus' }
        '401': { description: Authentication required }
        '403': { description: Missing CSRF }
        '404': { description: No accessible real room }
        '409': { description: Room is no longer proposed or the game handoff failed validation }
  /me/premade-queue/events:
    get:
      operationId: streamPremadeQueue
      security: [{ webSession: [] }]
      summary: Subscribe to account-scoped queue invalidations
      description: Shares the PostgreSQL queue channel with SoloQ. The client rereads its own premade snapshot on ready/changed and uses polling on disconnect. The server validates the persisted web session and active account before delivery. Event data contains no roster or MMR.
      responses:
        '200':
          description: No-store ready, changed and ping events
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Authentication required }
        '429': { description: Too many streams }
        '503': { description: Stream capacity exhausted }
  /local/premade/setup:
    get:
      operationId: getPremadeLabSetup
      security: []
      summary: Read synthetic groups and initialize the isolated lab session
      description: Requires local and soloq-lab profiles, a dedicated lab database and loopback binding. Shares the isolated lab cookie/CSRF contract with SoloQ. Normal profiles deny access.
      responses:
        '200':
          description: No-store setup and actor list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabSetup' }
        '401': { description: Lab unavailable in this profile }
  /local/premade:
    get:
      operationId: getPremadeLabQueue
      security: [{ soloQueueLabSession: [] }]
      summary: Read the selected synthetic actor's premade snapshot
      responses:
        '200':
          description: No-store simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '404': { description: Initialize the lab and select an actor first }
    post:
      operationId: enterPremadeLabQueue
      security: [{ soloQueueLabSession: [] }]
      summary: Queue a complete synthetic group as its captain
      description: Lab CSRF required. No client MMR, eligibility, roster or timestamps accepted. Reuses transactional premade reservations with SIMULATION provenance only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PremadeQueueAdmission' }
      responses:
        '200':
          description: No-store simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PremadeLabStatus' }
        '403': { description: Not the captain or missing lab CSRF }
        '404': { description: Group or actor unavailable }
        '409': { description: Stale lobby or unavailable group }
  /local/soloq:
    get:
      operationId: getSoloQueueLab
      security: []
      summary: Read the isolated local simulation and initialize its session and CSRF cookie
      description: Registered only with both local and soloq-lab profiles, on loopback with a dedicated lab database. Contains only synthetic actors. It does not open normal SoloQ, connect to WoW, issue addon codes or change ratings. Default and production profiles deny access. Room and ticket versions form a resynchronizable authoritative snapshot. English, Spanish and French development UI uses this separate contract.
      responses:
        '200':
          description: No-store simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '401': { description: Simulator not enabled in this profile }
  /local/soloq/events:
    get:
      operationId: streamSoloQueueLab
      security: [{ soloQueueLabSession: [] }]
      summary: Subscribe to synthetic actor invalidations
      description: Initial ready and changed events require a full snapshot resync. No replay history is claimed. The isolated server samples committed state every second across at most eight connections, sends heartbeat events, and closes streams on session revocation or actor changes. Reconnect and fallback polling recover persisted state across restarts. Ordinary web queues remain unavailable.
      responses:
        '200':
          description: No-store SSE invalidations with snapshot revision
          content:
            text/event-stream:
              schema: { type: string }
        '409': { description: Create a simulation first }
        '429': { description: Local stream capacity reached }
  /local/soloq/reset:
    post:
      operationId: resetSoloQueueLab
      security: [{ soloQueueLabSession: [] }]
      summary: Reset only the dedicated simulation
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [scenario], properties: { scenario: { type: string, enum: [NORMAL, NO_CAPTAINS, NO_HEALERS] } } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/actor:
    post:
      operationId: selectSoloQueueLabActor
      security: [{ soloQueueLabSession: [] }]
      summary: Choose a synthetic actor for this lab session
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accountId], properties: { accountId: { type: string, format: uuid } } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/selection:
    put:
      operationId: selectSoloQueueLabRole
      security: [{ soloQueueLabSession: [] }]
      summary: Set an idle synthetic actor's role and captain consent
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [role, captainConsent], properties: { role: { type: string, enum: [FC, HEALER, DPS] }, captainConsent: { type: boolean } } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/queue:
    post:
      operationId: enterSoloQueueLab
      security: [{ soloQueueLabSession: [] }]
      summary: Queue the selected synthetic actor
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/queue/{ticket}:
    delete:
      operationId: cancelSoloQueueLab
      security: [{ soloQueueLabSession: [] }]
      summary: Cancel the selected actor's waiting ticket
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/players:
    post:
      operationId: addSoloQueueLabPlayers
      security: [{ soloQueueLabSession: [] }]
      summary: Queue nineteen or ninety-nine synthetic peers
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [count], properties: { count: { type: integer, enum: [19, 99] } } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/rooms/{room}/response:
    post:
      operationId: respondSoloQueueLabRoom
      security: [{ soloQueueLabSession: [] }]
      summary: Accept or decline the selected actor's proposal room
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      parameters:
        - { name: room, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [accept], properties: { accept: { type: boolean } } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /local/soloq/rooms/{room}/test-acceptances:
    post:
      operationId: acceptSoloQueueLabPeers
      security: [{ soloQueueLabSession: [] }]
      summary: Explicitly simulate the other nineteen acceptances
      description: Isolated local lab only. Requires the RBGS_SOLOQ_LAB session and X-XSRF-TOKEN header matching RBGS_SOLOQ_LAB_XSRF. All actors and eligibility inputs are synthetic. The server controls acceptance and preparation deadlines; no caller timestamp, MMR or game-eligibility bypass is accepted.
      parameters:
        - { name: room, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: No-store authoritative simulation snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueLabSnapshot' }
        '400': { description: Invalid simulation command }
        '403': { description: CSRF unavailable }
        '404': { description: Actor, ticket or room unavailable to this session }
        '409': { description: Command conflicts with current state }
  /me/solo-queue:
    get:
      operationId: getOwnSoloQueue
      security: [{ webSession: [] }]
      summary: Read private SoloQ availability and an existing reservation
      description: No-store authoritative status. Initializes CSRF. Admission remains unavailable until Forever, addon/game-presence signals and the shared match-room handoff are implemented and verified. Classic or Anniversary picker data never establishes eligibility. Ticket snapshots, hidden MMR and other accounts are not exposed.
      responses:
        '200':
          description: Current availability and own ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueStatus' }
        '401': { description: Sign in required }
        '403': { description: Account unavailable }
    post:
      operationId: enterSoloQueue
      security: [{ webSession: [] }]
      summary: Request SoloQ admission with a versioned selection
      description: Requires CSRF and current season/selection versions. Revalidates account, selection, device, verified game signals and confirmed competitive data. Missing adapters fail closed with 409; there is no client or configuration bypass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seasonId, seasonVersion, selectionVersion]
              properties:
                seasonId: { type: string, format: uuid }
                seasonVersion: { type: integer, format: int64 }
                selectionVersion: { type: integer, format: int64 }
      responses:
        '200':
          description: Admitted or existing own reservation recovered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueStatus' }
        '400': { description: Missing or invalid versioned selection }
        '409':
          description: Admission unavailable; no search started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueStatus' }
        '401': { description: Sign in required }
        '403': { description: Account or CSRF unavailable }
  /me/solo-queue/events:
    get:
      operationId: streamOwnSoloQueue
      security: [{ webSession: [] }]
      summary: Receive account-scoped SoloQ invalidations
      description: No-store SSE ready/changed events and heartbeats; always reload GET status after ready, changed or reconnect. Persisted session/account access is revalidated before delivery. Poll status if streaming is unavailable.
      responses:
        '200':
          description: Private invalidation stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { description: Sign in required }
        '403': { description: Account unavailable }
        '429': { description: Too many streams for this account }
        '503': { description: Stream capacity reached }
  /me/solo-queue/rooms/{room}/response:
    post:
      operationId: respondOwnSoloQueueRoom
      security: [{ webSession: [] }]
      summary: Accept or decline only your own place in a proposed match
      description: Requires CSRF and membership. All twenty players must individually accept within sixty seconds. Rechecks every participant before acceptance. Decline or timeout cancels and releases every reservation. The twentieth acceptance transactionally creates and validates the shared Match and its twenty assignments; handoff failure rolls back the final acceptance. Repeated acceptance is idempotent.
      parameters:
        - { in: path, name: room, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accept]
              properties:
                accept: { type: boolean }
      responses:
        '200':
          description: Authoritative own queue and room status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SoloQueueStatus' }
        '400': { description: Missing accept decision }
        '401': { description: Sign in required }
        '403': { description: Account or CSRF unavailable }
        '404': { description: Room unavailable to this account }
        '409': { description: Proposal no longer awaiting acceptance }
  /me/solo-queue/{ticket}:
    delete:
      operationId: cancelOwnSoloQueueTicket
      security: [{ webSession: [] }]
      summary: Cancel an own waiting ticket
      description: Requires CSRF. Cancellation and proposal reservation share a PostgreSQL transaction lock across workers. Repeating a completed cancellation succeeds. A reserved proposal must be handled by the room lifecycle; queue cancellation cannot release its accounts.
      parameters:
        - { name: ticket, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Cancelled; no-store }
        '401': { description: Sign in required }
        '403': { description: Account or CSRF unavailable }
        '404': { description: Ticket unavailable to this account }
        '409': { description: Ticket already reserved for a proposal }
  /me/avatar-preference:
    get:
      operationId: getOwnAvatarPreference
      security: [{ webSession: [] }]
      summary: Read the account's preferred character portrait style
      description: Private no-store account preference. Defaults to sd; configured is false until explicitly saved. Initializes CSRF. Does not require a Battle.net provider request.
      responses:
        '200':
          description: Preferred style and whether it has been saved
          content:
            application/json:
              schema:
                type: object
                required: [style, configured]
                properties:
                  style: { type: string, enum: [sd, hd] }
                  configured: { type: boolean }
        '401': { description: Sign in required }
        '403': { description: Active account required }
    put:
      operationId: setOwnAvatarPreference
      security: [{ webSession: [] }]
      summary: Save how this account's character appears to other lobby members
      description: Requires CSRF. Persists independently of the selected character. Lobby snapshots resolve avatarUrl using the owner's preference, with a fallback when a variant is unavailable. Changes notify lobby peers through SSE; identical saves do not notify or write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [style]
              properties:
                style: { type: string, enum: [sd, hd] }
      responses:
        '200': { description: Saved style and configured true; no-store }
        '400': { description: Invalid style }
        '401': { description: Sign in required }
        '403': { description: Account or CSRF unavailable }
  /me/play-character:
    get:
      operationId: getOwnPlayCharacter
      security: [{ webSession: [] }]
      summary: Read the current account's selected Play character
      description: Private no-store preference, independent of a season or connected desktop app. Returns an empty body before the first selection. Initializes the CSRF cookie. This is an authenticated Classic or Forever picker reference; competitive selection and queue eligibility remain separate.
      responses:
        '200':
          description: Selected character or empty body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayCharacterSelected' }
        '401': { description: Sign in required }
        '403': { description: Account unavailable }
    put:
      operationId: selectOwnPlayCharacter
      security: [{ webSession: [] }]
      summary: Select an owned Play character and derive its EU/NA region
      description: Requires CSRF and the current user's Battle.net wow.profile authorization. Accepts only Forever at level 1+. Resolves exactly one complete provider reference from the bounded authenticated character list before starting a database transaction. Names, realms and EU/NA region are server-derived; callers cannot supply a lobby region. Serializes with lobby admission under the account lock. A grouped player may change characters only within the fixed lobby region; leave first to change regions. Identical selections avoid writes and events. Changes notify lobby peers through SSE. Requires neither a season nor a desktop device; competitive selections remain separate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlayCharacterReference' }
      responses:
        '200':
          description: Verified selected character; no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlayCharacterSelected' }
        '400': { description: Incomplete or unsupported reference }
        '401': { description: Sign in or renew Battle.net authorization }
        '403': { description: Account, CSRF or wow.profile permission unavailable }
        '409': { description: Character belongs to another lobby region; existing selection is retained }
        '422': { description: Reference does not resolve to exactly one owned Forever level-1+ character }
        '502': { description: Blizzard unavailable }
        '504': { description: Character lookup timed out }
  /me/group-events:
    get:
      operationId: streamOwnLobbyChanges
      security: [{ webSession: [] }]
      summary: Subscribe to private lobby invalidations
      description: >-
        SSE for the current active account, including incoming invitations before joining a group.
        Events ready, changed, removed and ping carry only {}. Removed is sent only to a player
        expelled by the captain after the transaction commits, never for leaving or switching lobbies.
        The web shows a dismissible 15-second notice. On every ready, fetch the authenticated group,
        invitation and play-context snapshots; events have no replay IDs. Ready advertises a 3000ms
        reconnect delay. Ping runs every 15 seconds and revalidates the stored session and account.
        Streams close after five minutes and reconnect normally. PostgreSQL transactional notifications
        synchronize API instances; rollback never publishes a change. No lobby is created by subscribing.
        At most four streams per account and 1024 per instance by default. Hidden pages
        unsubscribe. While connected the web retains a 60-second health refresh; disconnected clients
        use the existing 15/60-second adaptive polling. This does not enter a matchmaking queue.
      responses:
        '200':
          description: Private SSE stream; no-store and X-Accel-Buffering no
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            X-Accel-Buffering: { schema: { type: string, const: 'no' } }
          content:
            text/event-stream:
              schema: { type: string }
              example: "event:ready\nretry:3000\ndata:{}\n\n"
        '401': { description: Sign in with a live web session }
        '403': { description: Account unavailable }
        '429': { description: Account stream limit reached }
        '503': { description: Instance stream capacity reached }
  /me/group:
    get:
      operationId: getOwnPremadeGroup
      security: [{ webSession: [] }]
      summary: Read the current account's private premade lobby
      description: Returns an empty body when not a member. All group responses use no-store. A live account and web session are required; reading initializes the CSRF cookie. No public group directory exists.
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '401': { description: Sign in required }
        '403': { description: Account unavailable }
  /me/group-invitations:
    get:
      operationId: getOwnGroupInvitations
      security: [{ webSession: [] }]
      summary: Read unexpired invitations addressed to the authenticated account
      responses:
        '200':
          description: Private invitation list; no-store
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GroupInvitation' } }
  /groups:
    post:
      operationId: createPremadeGroup
      security: [{ webSession: [] }]
      summary: Create a lobby or recover the current account's existing lobby
      description: Requires X-XSRF-TOKEN matching the CSRF cookie. Requires a previously selected Play character. The lobby region is fixed from that verified character, independent of account region. Repeated and concurrent calls return existing membership without changing captain, region, code or roster. New membership rejects active matches and unresolved competitive results; expired CONTROLLED_TEST/CAPTURE_ONLY diagnostics past their verification deadline do not reserve an account and remain in history/review. Initializes a SecureRandom eight-character lobby code (40 bits) for a new group, with serialized collision retries. Does not enter a queue.
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '409': { description: Select a Play character first, resolve an active match/competitive result, or reload a changed group }
  /groups/join:
    post:
      operationId: joinPremadeByCode
      security: [{ webSession: [] }]
      summary: Join an open lobby with a shared code
      description: Requires CSRF. Joining the same lobby is idempotent. A valid code for another lobby atomically transfers the caller after selected-character region, capacity/account/match checks, retaining the current lobby on failure. Source captain departure promotes the oldest remaining member; only an empty source is deleted. Locks both groups in stable order before the account and retries if membership changed. Role labels and membership seniority reset. No queue admission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 1, maxLength: 64, description: Eight-character lobby code from ABCDEFGHJKLMNPQRSTUVWXYZ23456789; case-insensitive with surrounding whitespace stripped. Invalid formats consume the join-attempt limit and return 404. }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '404': { description: Invalid, disabled, superseded code or closed lobby; ask captain for a current code }
        '409': { description: Full lobby, other group membership or unresolved match }
        '429': { description: Wait one minute before another code attempt }
  /groups/{id}/code:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }]
    post:
      operationId: managePremadeLobbyCode
      security: [{ webSession: [] }]
      summary: Captain regenerates or disables the shared code
      description: Requires CSRF. enabled=true always generates a fresh code; enabled=false disables code entry. Previous codes stop admitting members. Does not change roster revision or confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/GroupRevision' }
                - type: object
                  required: [enabled]
                  properties:
                    enabled: { type: boolean }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '403': { description: Only captain may change the code }
        '409': { description: Stale roster revision }

  /groups/{id}/invitations:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }]
    post:
      operationId: invitePremadePlayer
      security: [{ webSession: [] }]
      summary: Captain invites a registered active player's full BattleTag
      description: Requires CSRF. Thirty-minute expiry; at most twenty live invitations per group. An exact unambiguous active account must match. Renews an existing invitation for the same account. Does not change roster revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/GroupRevision' }
                - type: object
                  required: [battleTag]
                  properties:
                    battleTag: { type: string, maxLength: 100, pattern: '^[^\p{Cntrl}]+#[0-9]+$' }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '409': { description: Stale group, unknown BattleTag, full group, invitation limit, existing membership or unresolved match }
  /me/group-invitations/{invitationId}/accept:
    parameters: [{ $ref: '#/components/parameters/GroupInvitationId' }]
    post:
      operationId: acceptGroupInvitation
      security: [{ webSession: [] }]
      summary: Authenticated recipient accepts their invitation
      description: Requires CSRF. Locks the group and the joining account, enforcing ten distinct accounts and unique membership across groups/devices. All other invitations addressed to the new member are deleted. Bumps roster revision. Does not confirm readiness or enter a queue.
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '404': { description: Invitation absent or belongs to another account }
        '409': { description: Expired invitation, full group, existing membership or unresolved match }
  /me/group-invitations/{invitationId}/decline:
    parameters: [{ $ref: '#/components/parameters/GroupInvitationId' }]
    post:
      operationId: declineGroupInvitation
      security: [{ webSession: [] }]
      summary: Recipient declines an invitation
      description: Requires CSRF.
      responses:
        '200': { description: Invitation removed; empty body; no-store }
        '404': { description: Invitation absent or belongs to another account }
  /groups/{id}/invitations/{invitationId}/cancel:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }, { $ref: '#/components/parameters/GroupInvitationId' }]
    post:
      operationId: cancelGroupInvitation
      security: [{ webSession: [] }]
      summary: Captain cancels an outgoing invitation
      description: Requires CSRF.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupRevision' }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '403': { description: Captain required }
        '404': { description: Invitation or group unavailable to caller }
        '409': { description: Stale roster revision }
  /groups/{id}/captain:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }]
    post:
      operationId: transferGroupCaptain
      security: [{ webSession: [] }]
      summary: Captain explicitly transfers leadership to another member
      description: Requires CSRF. Changes roster revision and invalidates all confirmations. Independent of SoloQ captain consent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupTargetCommand' }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '403': { description: Captain required }
        '404': { description: Group or target unavailable }
        '409': { description: Stale roster revision or same captain }
  /groups/{id}/members/remove:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }]
    post:
      operationId: removeGroupMember
      security: [{ webSession: [] }]
      summary: Leave the group or captain removes another member
      description: Requires CSRF. When the captain leaves, leadership passes atomically to the remaining member with the earliest membership order. Rejoining starts a new membership order. Last departure closes the group and invalidates its invitations/code. Other departures invalidate all roster confirmations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GroupTargetCommand' }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '403': { description: Cannot remove another member without captain permission }
        '409': { description: Stale roster revision }
  /groups/{id}/role:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }]
    post:
      operationId: updatePremadeDisplayRole
      security: [{ webSession: [] }]
      summary: Update the authenticated member's selected lobby role label
      description: Requires CSRF and current membership. The role is visual only, never a premade admission or composition requirement. Uses a member-specific role version; does not change the roster revision or SoloQ selection. The returned snapshot is visible to members on refresh.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedRoleVersion, role]
              properties:
                expectedRoleVersion: { type: integer, minimum: 0 }
                role: { type: string, enum: [FC, HEALER, DPS] }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '400': { description: Invalid role or version }
        '404': { description: Current account is not a member of this group }
        '409': { description: Role changed on another device; refresh before retrying }
  /groups/{id}/readiness:
    parameters: [{ $ref: '#/components/parameters/PremadeGroupId' }]
    post:
      operationId: confirmGroupPreparation
      deprecated: true
      security: [{ webSession: [] }]
      summary: Confirm or withdraw the authenticated member's saved selection
      description: Legacy compatibility endpoint; individual confirmations are no longer used or required by the lobby or future queue admission. Requires CSRF. Confirmation binds group revision, season ID/version and selection version; changes invalidate confirmation. This is consent to the saved preparation, not eligibility. No queue admission or participant snapshot is issued; Forever/addon compatibility and matchmaking remain unavailable. Connection health, addon status and observed presence are separate fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/GroupRevision' }
                - type: object
                  required: [confirmed]
                  properties:
                    confirmed: { type: boolean }
                    seasonId: { type: string, format: uuid, description: Required for confirmation }
                    seasonVersion: { type: integer, minimum: 0, description: Required for confirmation }
                    selectionVersion: { type: integer, minimum: 0, description: Required for confirmation }
      responses:
        '200': { $ref: '#/components/responses/PremadeGroup' }
        '409': { description: Stale group/season/selection, missing saved selection or unresolved match }
  /auth/api-client/requests:
    post:
      operationId: startApiClientLogin
      x-spring-profiles: [local]
      summary: Start a five-minute API client login handoff
      security: []
      description: Native transport only; rejects Origin and Sec-Fetch-Site. Returns approvalPath with browser-only
        secret in fragment, distinct pollingSecret, expiresIn=300 and intervalSeconds=5. Five starts per IP per minute.
        In-memory on one instance; restarting invalidates pending requests. Browser approval is explicit and the server
        retains the Battle.net authorized client.
      responses:
        '200':
          description: approvalPath, pollingSecret, expiresIn, intervalSeconds; no-store
        '403':
          description: Browser transport forbidden
        '429':
          description: Rate limited
  /auth/api-client:
    get:
      operationId: apiClientApprovalPage
      x-spring-profiles: [local]
      security: []
      responses:
        '200':
          description: Uncached HTML page; reads approval secret from URL fragment and asks explicit approval after
            web login
  /auth/api-client/login:
    get:
      operationId: loginForApiClient
      x-spring-profiles: [local]
      security: []
      responses:
        '302':
          description: Start normal Battle.net OAuth and return to the fixed approval page
  /auth/api-client/approve:
    post:
      operationId: approveApiClientLogin
      x-spring-profiles: [local]
      security:
      - webSession: []
      description: Requires active account and CSRF. Browser-only approval secret. Approval is single-use, does not
        extend expiry, and does not disclose any credential.
      responses:
        '204':
          description: Approved
        '401':
          description: Web session or Battle.net authorized client missing
        '403':
          description: Account inactive or invalid CSRF
        '410':
          description: Expired, unknown or already approved
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
  /auth/api-client/token:
    post:
      operationId: exchangeApiClientLogin
      x-spring-profiles: [local]
      security: []
      description: Native polling secret only. Rejects Origin/Sec-Fetch-Site and existing sessions. Send without Cookie.
        PENDING until explicit browser approval. PAIRED creates an independent web session and transfers the authorized
        client server-side, returning sessionId and csrfToken, never a Battle.net token. Active account is rechecked.
        Single-use; lost successful response requires a new login. No-store. 120 polls per IP per minute.
      responses:
        '200':
          description: status PENDING with null credentials, or PAIRED with sessionId and csrfToken
        '403':
          description: Browser transport or inactive account
        '409':
          description: Existing session cookie must be omitted
        '410':
          description: Expired, unknown or consumed
        '429':
          description: Rate limited
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - secret
              properties:
                secret:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
  /device-launches:
    post:
      operationId: authorizeCompanionLaunch
      summary: Open and connect the companion with capture permissions
      description: Active web session and X-XSRF-TOKEN required. The user-initiated web action submits the approved linking and capture authorization. Derives the account from the session. Returns a 120-second launch ticket for rbgs-companion://connect/TICKET, never a device credential. Ten requests per identity per minute. Ticket must not be logged or stored persistently.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [acceptCapturePermissions]
              properties:
                acceptCapturePermissions: { type: boolean, const: true }
      responses:
        '200':
          description: 'Short-lived native launch ticket; no-store'
          content:
            application/json:
              schema:
                type: object
                required: [id, launchSecret, expiresAt]
                properties:
                  id: { type: string, format: uuid }
                  launchSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  expiresAt: { type: string, format: date-time }
        '401': { description: 'Web session required' }
        '403': { description: 'CSRF, active account and explicit capture consent required' }
        '429': { description: 'Retry-After 60 seconds' }
  /device-launches/{id}:
    get:
      operationId: inspectCompanionLaunch
      summary: Read connection progress for an own launch
      description: Only the active account that created the launch can inspect it. PAIRED requires an authenticated native heartbeat after creation. No credential, ticket or native proof is returned. Poll every two seconds; 120 reads per identity per minute. Browser selects the returned own device after completion.
      security: [{ webSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 'Own connection progress; no-store'
          content:
            application/json:
              schema:
                type: object
                required: [status, deviceId, expiresAt]
                properties:
                  status: { type: string, enum: [PENDING, CONNECTING, PAIRED] }
                  deviceId: { type: [string, 'null'], format: uuid, description: 'Only returned after the native heartbeat' }
                  expiresAt: { type: string, format: date-time }
        '401': { description: 'Web session required' }
        '403': { description: 'Active account required' }
        '410': { description: 'Unknown, expired, another account, or revoked/expired device' }
        '429': { description: 'Retry-After 60 seconds' }
  /companion/connect:
    post:
      operationId: redeemCompanionLaunch
      summary: Redeem a web launch from native code
      description: Stateless native transport; ignores web cookies and rejects Origin or Sec-Fetch-Site headers. Requires the web-issued launchSecret and a new 32-byte random lowercase-hex clientSecret held only in native memory. First redemption atomically binds the proof and device; same proof may recover a lost response within ticket expiry. Different proofs and revoked/expired devices cannot replay. Optional existing bearer reuses the same account device and upgrades capture scope without rotating its credential; a different account returns 409. Invalid bearer returns 401 and native may retry without it. New issuance obeys the five-device limit. All credentials remain hashed in storage. Native verifies and saves credentials in Windows before sending heartbeat.
      security: []
      parameters:
        - { name: Authorization, in: header, required: false, schema: { type: string }, description: 'Optional existing device Bearer credential' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [launchSecret, clientSecret]
              properties:
                launchSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                clientSecret: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: 'Native credential issuance or existing credential reuse; no-store'
          content:
            application/json:
              schema:
                type: object
                required: [status, token, deviceId, expiresAt, scope]
                properties:
                  status: { type: string, const: PAIRED }
                  token: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{43}$', description: 'Null when reusing the existing bearer' }
                  deviceId: { type: string, format: uuid }
                  expiresAt: { type: string, format: date-time }
                  scope: { type: string, const: 'companion:status companion:assignments evidence:write' }
        '400': { description: 'Invalid ticket or native proof' }
        '401': { description: 'Invalid, revoked or expired supplied bearer' }
        '403': { description: 'Browser transport forbidden' }
        '409': { description: 'Different account or active device limit reached' }
        '410': { description: 'Unknown, expired, already claimed with another proof, revoked device or inactive launch account' }
        '429': { description: 'Retry-After 60 seconds; 120 per IP and 30 per ticket per minute' }
  /companion/heartbeat:
    post:
      operationId: recordCompanionHeartbeat
      summary: Record a native device connection signal
      description: Stateless device bearer authorization; web cookies cannot substitute it. Both existing status-only and capture-scoped active devices can send. Uses server receipt time; no client timestamp, game state or ownership claim. Twelve requests per device per minute. Native schedule is approximately 15 seconds. Web connected status expires 45 seconds after the latest signal and is immediately false for revoked/expired devices. Ordinary GET status does not record presence.
      security: [{ deviceCredential: [] }]
      responses:
        '200': { description: 'Authorized deviceId, accountId, current scope and accountName; no-store' }
        '401': { description: 'Missing, invalid, revoked or expired device or inactive account' }
        '429': { description: 'Retry-After 60 seconds' }
  /device-pairings/browser/details:
    post:
      operationId: previewBrowserPairing
      summary: Inspect a short-lived native connection request
      description: Active web session and CSRF required. approvalSecret is separate from the native polling secret and is submitted only in the body. Preview never approves. The URL fragment is removed by the frontend; its temporary handle can survive a login redirect in session storage for at most five minutes. After approval only the approving account can inspect the request. The PAIRED state means credential issuance, not a heartbeat. No device token or native polling secret is returned. 120 reads per signed-in identity per minute.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserPairingApproval' }
      responses:
        '200':
          description: 'Signed-in accountName, scope, expiresAt, PENDING/APPROVED/PAIRED and nullable deviceId; no device name; no-store'
        '403': { description: 'Web account and CSRF required; device bearer is insufficient' }
        '410': { description: 'Unknown, expired or approved for another account' }
  /device-pairings/browser/approve:
    post:
      operationId: approveBrowserPairing
      summary: Explicitly approve the displayed PC and permissions without typing a code
      description: Same short-lived handle and web/CSRF requirements as preview. Single approval only; does not extend expiry. Scope is frozen at creation. Capture-scoped requests require acceptCapturePermissions=true; the approval button explicitly describes those permissions. The native process alone exchanges its distinct polling secret and stores the issued credential in Windows. Ten approvals per signed-in identity per minute.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BrowserPairingApproval' }
      responses:
        '200': { description: 'Approved request without device credential; no-store' }
        '403': { description: 'Web session, CSRF or explicit capture consent missing' }
        '410': { description: 'Unknown, expired or already approved request' }
  /me/matches:
    get:
      operationId: listOwnMatchHistory
      summary: List only the authenticated participant's assigned matches
      description: No-store. Current active account required. Keyset pagination orders createdAt then match UUID descending. Result filters WIN/LOSS/DRAW use only verified or moderator-resolved outcomes mapped to the participant's assigned team. Capture-only tests cannot become wins/losses. Controlled tests follow the existing availability flag. No raw reports, account/device IDs, codes or moderator identity are returned. Unread markers persist until explicitly acknowledged; counters in the UI describe loaded matches only.
      security: [{ webSession: [] }]
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [ALL, WIN, LOSS, DRAW, PENDING, REVIEW, VERIFIED, RESOLVED, VOIDED, CANCELLED], default: ALL } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 256 } }
      responses:
        '200':
          description: Participant history page; also establishes the CSRF cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantHistoryPage' }
        '400': { description: 'Invalid filter, limit or cursor' }
        '401': { description: 'Web login required' }
        '403': { description: 'Current active account required' }
  /me/matches/{id}:
    get:
      operationId: getOwnMatchHistoryDetail
      summary: Read participant-safe match details and the account's own dispute
      description: No-store. Assignment membership is required even for moderators. Own scoreboard observations preserve unknown statistics as null and are not canonical outcome proof. Other participants' conversations, report bodies, private account identifiers and moderator-only audit fields are omitted. Result updates and conversation messages are bounded to the latest 100 each, with a truncation flag. Reading does not mark updates as read.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Participant match detail; also establishes the CSRF cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantMatchDetail' }
        '401': { description: 'Web login required' }
        '403': { description: 'Current active account required' }
        '404': { description: 'No assigned match for this account' }
        '503': { description: 'Controlled tests unavailable' }
  /me/matches/{id}/disputes:
    post:
      operationId: openOwnMatchDispute
      summary: Open or reopen the participant's dispute with a required reason
      description: Requires current result version, participant membership and CSRF. Pending results and cancelled tests cannot be disputed. At most one conversation exists per account/match; an open conversation must use replies. Opening a dispute retains prior events, clears the current canonical outcome and enters REVIEW / PLAYER_DISPUTE. Messages remain private to their author and moderators. No rating mutation occurs. Ten player messages per conversation per 15 minutes are allowed.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-XSRF-TOKEN, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeWrite' }
      responses:
        '200':
          description: Persisted private conversation; no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDisputeThread' }
        '400': { description: 'Invalid message or missing version' }
        '401': { description: 'Web login required' }
        '403': { description: 'Active account and CSRF required' }
        '404': { description: 'No assigned match' }
        '409': { description: 'Stale result, pending/cancelled match or existing open dispute' }
        '429': { description: 'Message rate limit reached' }
  /me/matches/{id}/disputes/replies:
    post:
      operationId: replyToOwnMatchDispute
      summary: Add context or respond to an evidence request in the account's own conversation
      description: expectedVersion is the current conversation version, not the match version. A moderator request sets WAITING_PLAYER; a player reply sets OPEN. Match locking serializes replies with decisions and cancellation. Stale or closed threads return 409. Evidence files continue to use the authenticated companion upload flow; this route accepts plain text only.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-XSRF-TOKEN, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DisputeWrite' }
      responses:
        '200':
          description: Updated private conversation; no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchDisputeThread' }
        '400': { description: 'Invalid message or version' }
        '401': { description: 'Web login required' }
        '403': { description: 'Active account and CSRF required' }
        '404': { description: 'No own assigned match or conversation' }
        '409': { description: 'Stale or closed conversation, or cancelled test' }
        '429': { description: 'Message rate limit reached' }
  /me/matches/{id}/read:
    post:
      operationId: acknowledgeOwnMatchUpdates
      summary: Mark the result and conversation versions explicitly seen by the participant
      description: No GET has this side effect. Both current result version and, when a thread exists, its current version must match. A newer request or decision cannot be silently acknowledged by an older view. Markers persist across browser sessions. Notifications in this implementation are in the history page on refresh/navigation, with no email, push or SSE delivery.
      security: [{ webSession: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: X-XSRF-TOKEN, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
