    get:
      operationId: getOwnCaptureAssignment
      description: Requires companion:assignments. Frozen schema-2 descriptor contains match/assignment/capture UUIDs, assignedCharacterId, assignedTeamKey A/B, rosterVersion 1, mode CONTROLLED_TEST, expectedMapProfile DARKSPEAR_DIAGNOSTIC, FOREVER_WSG_TEST or TBC_ANNIVERSARY_WSG_TEST (CAPTURE_ONLY only), expectedRoster, issuedAt, armUntil and assignmentCodeSha256. CAPTURE_ONLY descriptors additionally carry testKind CAPTURE_ONLY, assignedTeamKey null and exactly one expectedRoster row containing only the declared own character with assignedTeamKey null. This row is a reporter declaration, not an expected game roster. Legacy roster descriptors keep their original shape. Older companions reject the new variant safely and must be updated before issuing a capture-only code. Never returns the plaintext code. Readable after expiry/cancellation for evidence recovery.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "Frozen own assignment descriptor; no-store" }
        '404': { description: "No own assignment" }
        '409': { description: "Code not issued" }
  /companion/assignments/{captureId}/issue:
    post:
      operationId: issueOwnCaptureCode
      description: Requires companion:assignments. Once only, before armUntil, while not cancelled. Returns assignment descriptor and assignmentCode (16 uppercase Crockford characters). Server persists only its SHA-256. A lost issuance requires a fresh assignment unless the addon or this PC already has the code. For CAPTURE_ONLY, the native caller must advertise X-RBGS-Capture-Test-Kinds CAPTURE_ONLY. An unsupported caller receives 409 before any code is consumed. Legacy roster issuance needs no capability header. Ten requests per account per minute; no-store.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: header, name: X-RBGS-Capture-Test-Kinds, required: false, schema: { type: string, enum: [CAPTURE_ONLY] } }
        - { in: header, name: X-RBGS-Capture-Test-Profile, required: false, schema: { type: string, description: Comma-separated supported capture-only profiles (FOREVER_WSG_TEST and/or TBC_ANNIVERSARY_WSG_TEST) }, description: "Required for temporary TBC WSG issuance. Unsupported clients receive 409 before consuming the code." }
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: "Own plaintext code issued once" }
        '404': { description: "No own assignment" }
        '409': { description: "Code already issued or companion does not support individual capture tests; unsupported capability does not consume the code" }
        '410': { description: "Cancelled or arming window expired" }
  /evidence:
    post:
      operationId: storeCaptureEvidence
      description: Native bearer evidence:write only; no web cookie authorization. Strict schema 2, at most 256 KiB, 40 score rows, depth 30, duplicate JSON keys rejected. Root requires schemaVersion, matchId, assignmentId, captureId, captureRevision, assignmentCode, client, observedCharacter, capture. Accepts wow_classic_beta with darkspear-scoreboard-v1 or legacy darkspear-70338-test-1, and temporary wow_anniversary with tbc-anniversary-wsg-test-v1 for map 489 / TBC_ANNIVERSARY_WSG_TEST. Also accepts wow_forever with forever-wsg-v1 for map 489 / FOREVER_WSG_TEST. Client and map profile must match the frozen assignment; both WSG test profiles are CAPTURE_ONLY and cannot verify outcomes or apply rating. Game version, build and positive interface are retained as bounded metadata rather than patch allowlists; the supported map and data shape remain enforced. Nullable Lua members must become explicit JSON null. Canonical UTF-8 uses sorted object keys, ordered arrays and nonnegative safe integers. Identity/stats remain observations. Idempotency key is account/assignment/capture/revision; different canonical content returns 409. Evidence and processing job commit before receipt. Stored report replaces plaintext assignmentCode with assignmentCodeSha256, preserving other members; submitted/stored hashes are separate. For compatibility the receipt processingStatus still advances from PENDING to REVIEW after processing; authoritative match verification is exposed separately by the result routes. Delayed uploads are evaluated against assignment and game timing, never upload expiry alone; cancelled reports remain review evidence. No rating is applied. Sixty writes per account per minute.
      security: [{ deviceCredential: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaVersion, matchId, assignmentId, captureId, captureRevision, assignmentCode, client, observedCharacter, capture]
              additionalProperties: false
              properties:
                schemaVersion: { type: integer, const: 2 }
                matchId: { type: string, format: uuid }
                assignmentId: { type: string, format: uuid }
                captureId: { type: string, format: uuid }
                captureRevision: { type: integer, minimum: 1, maximum: 2147483647 }
                assignmentCode: { type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{16}$' }
                client: { type: object, description: "Exact addonVersion, adapterVersion, product, gameVersion, gameBuild, interface and companionVersion members" }
                observedCharacter: { $ref: '#/components/schemas/CaptureIdentity' }
                capture: { type: object, description: "Exact state, stage, continuity, incompleteReason, map, startedAt, endedAt, roster and outcome members, plus optional interruptions. COMPLETE requires a fresh final scoreboard on the client/profile map (2997 for Darkspear, 489 for the temporary TBC WSG test). Continuity is CONTINUOUS, RESUMED or UNKNOWN. RESUMED requires 1-32 ordered interruption objects with Unix-second before/after values and gaps of at most 120 seconds; it cannot satisfy automatic full-roster verification. UNKNOWN cannot be COMPLETE." }
      responses:
        '200':
          description: Durable receipt; storage does not imply match verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureReceipt' }
        '401': { description: "Missing, expired or revoked device" }
        '403': { description: "Missing scope or incorrect own assignment/code binding" }
        '404': { description: "No own assignment" }
        '409': { description: "Different content under existing revision" }
        '413': { description: "Body exceeds 256 KiB" }
        '415': { description: "JSON required" }
        '422': { description: "Invalid or unsupported capture" }
        '429': { description: "Retry-After 60 seconds" }
        '503': { description: "Controlled testing disabled" }
  /evidence/receipts/{assignmentId}/{captureId}/{revision}:
    get:
      operationId: recoverOwnCaptureReceipt
      description: Requires evidence:write. Own account-bound receipt recovery after response loss or restart; no-store. Verify IDs, revision, durablyStored and contentSha256 before marking local ACKNOWLEDGED. Processing status may advance from PENDING to REVIEW.
      security: [{ deviceCredential: [] }]
      parameters:
        - { in: path, name: assignmentId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: captureId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: revision, required: true, schema: { type: integer, minimum: 1, maximum: 2147483647 } }
      responses:
        '200':
          description: Previously committed receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaptureReceipt' }
        '404': { description: "No own stored receipt" }
  /device-pairings:
    post:
      operationId: startDevicePairing
      summary: Create a five-minute desktop pairing request
      description: Stateless; ignores web cookies. Returns a visible approval code and separate secret polling credential. No-store. Limited to five creations per peer IP per minute on this single API instance. Secrets must not be logged or placed in URLs.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, enum: ['companion:status', 'companion:status companion:assignments evidence:write'], default: 'companion:status' }
      responses:
        '200':
          description: Pending pairing; neither value authenticates a device yet
          content:
            application/json:
              schema:
                type: object
                required: [code, pollingSecret, expiresAt, intervalSeconds, approvalSecret]
                properties:
                  code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{10}$' }
                  pollingSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
                  expiresAt: { type: string, format: date-time }
                  intervalSeconds: { type: integer, const: 5 }
                  approvalSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$', description: 'Short-lived browser approval handle; cannot exchange a device credential' }
        '400': { description: "Invalid scope" }
        '429': { description: "Rate limited; Retry-After is 60 seconds" }
  /device-pairings/approve:
    post:
      operationId: approveDevicePairing
      summary: Approve a code for the current active Battle.net account
      description: Requires web session and X-XSRF-TOKEN. Approve only a code from your own companion. Approval is single-use and does not extend expiry. Limited to ten attempts per signed-in identity per minute. Approval never returns polling secrets or device tokens.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-HJ-NP-Z2-9]{10}$' }
                acceptCapturePermissions: { type: boolean, default: false, description: "Must be true when approving a capture-scoped request" }
      responses:
        '204': { description: "Approved; companion must exchange its polling secret" }
        '400': { description: "Invalid code format" }
        '401': { description: "No web session" }
        '403': { description: "Inactive account or invalid CSRF" }
        '410': { description: "Unknown, expired, approved or consumed code" }
        '429': { description: "Rate limited; Retry-After is 60 seconds" }
  /device-pairings/token:
    post:
      operationId: exchangeDevicePairing
      summary: Poll approval and exchange once for a device credential
      description: Stateless and no-store. Poll at most once every five seconds. Approved requests are locked transactionally; concurrent exchanges yield one device. Five active devices per account. PAIRED issues a 90-day opaque credential with the approved requested scope; existing credentials remain status-only. A lost successful response requires a new pairing. Device credentials cannot authenticate web commands.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pollingSecret]
              properties:
                pollingSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
      responses:
        '200':
          description: Pending approval or a single issued credential
          content:
            application/json:
              schema:
                type: object
                required: [status, token, deviceId, expiresAt, scope]
                properties:
                  status: { type: string, enum: [PENDING, PAIRED] }
                  token: { type: [string, 'null'], pattern: '^[A-Za-z0-9_-]{43}$' }
                  deviceId: { type: [string, 'null'], format: uuid }
                  expiresAt: { type: [string, 'null'], format: date-time }
                  scope: { type: [string, 'null'], enum: [null, 'companion:status', 'companion:status companion:assignments evidence:write'] }
        '400': { description: "Invalid polling credential format" }
        '409': { description: "Active device limit reached; revoke a device" }
        '410': { description: "Unknown, expired, consumed pairing or inactive account" }
        '429': { description: "Rate limited; Retry-After is 60 seconds" }
  /devices/me:
    get:
      operationId: listMyDevices
      summary: List this account's devices without credentials
      description: Requires current active web account. Establishes CSRF cookie; no-store. Returns only devices with unrevoked, unexpired access that have not been removed from the listing. Revoked and expired registrations are retained internally for historical references and disappear automatically from this response. A valid offline device remains listed; paired does not mean currently connected or in-game.
      security: [{ webSession: [] }]
      responses:
        '200':
          description: Own devices with valid access, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { description: "No web session" }
        '403': { description: "Inactive account" }
  /devices/{id}/record:
    delete:
      operationId: removeInactiveDeviceFromList
      deprecated: true
      summary: Remove an own revoked or expired device from the visible list
      description: Active web session and X-XSRF-TOKEN required. Server checks account ownership and locks the device. Only revoked or expired devices may be removed; an offline device with valid access must first be revoked. Repeated removal is idempotent. V16 records removed_at and excludes the device from devices/me while preserving credential history, pairing links and capture evidence references. This never grants or restores device access.
      security: [{ webSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: 'Removed from the list; no-store' }
        '401': { description: 'Web session required; device bearer cannot substitute it' }
        '403': { description: 'Inactive account or missing/invalid CSRF' }
        '404': { description: 'Unknown device or belongs to another account' }
        '409': { description: 'Device access remains active; revoke first' }
  /devices/{id}:
    delete:
      operationId: revokeMyDevice
      summary: Revoke an owned device immediately
      description: Requires current active web account and X-XSRF-TOKEN. Repeating revocation succeeds. No-store.
      security: [{ webSession: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: "Revoked" }
        '401': { description: "No web session" }
        '403': { description: "Inactive account or invalid CSRF" }
        '404': { description: "Device missing or owned by another account" }
  /companion/status:
    get:
      operationId: getCompanionConnection
      summary: Verify scoped device connectivity authorization
      description: Stateless bearer authentication; web cookies cannot substitute a credential. Reads current device expiry/revocation and persisted account status on every request. No-store. Does not establish addon freshness, game participation, readiness or match eligibility.
      security: [{ deviceCredential: [] }]
      responses:
        '200':
          description: Authorized account-bound device
          content:
            application/json:
              schema:
                type: object
                required: [deviceId, accountId, scope, accountName]
                properties:
                  deviceId: { type: string, format: uuid }
                  accountId: { type: string, format: uuid }
                  accountName: { type: string, maxLength: 100, description: "Current display name of the authenticated Battle.net account; display only, not an identity key." }
                  scope: { type: string, enum: ['companion:status', 'companion:status companion:assignments evidence:write'] }
        '401': { description: "Missing, invalid, expired or revoked device credential or inactive account" }
  /play/context:
    get:
      operationId: getPlaySelectionContext
      summary: Get the authenticated account's configured season and saved selection
      description: Requires a current active account. Establishes the CSRF cookie. Cache-Control is no-store. No configured season returns season and selection as null. Ownership verification is currently UNVERIFIED and matchmakingAvailable is always false; Classic data cannot authorize selection.
      responses:
        '200':
          description: Selection context; no queue eligibility is implied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaySelectionContext' }
        '401': { description: "No Battle.net session" }
        '403': { description: "Missing or inactive account" }
        '503': { description: "Configured season does not exist" }
  /me/premade-selection:
    put:
      operationId: savePremadeCharacterSelection
      summary: Save character and linked device without choosing a competitive role
      description: Requires CSRF and an active account. Uses the existing season, character ownership, linked-device and expected-version checks. Preserves SoloQ role and captain consent atomically; leaves role null if none has been chosen. Does not create a lobby or enter a queue.
      security: [{ webSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PremadeSelectionRequest' }
      responses:
        '200':
          description: Saved character selection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonSelection' }
        '400': { description: Invalid character declaration or request }
        '401': { description: Session required }
        '403': { description: Inactive account or missing CSRF }
        '409': { description: Stale selection or season }
        '412': { description: Linked device required }
  /me/selection:
    put:
      operationId: saveSeasonSelection
      summary: Persist the authenticated account's character declaration or verified reference
      description: Requires X-XSRF-TOKEN and a current active account. Account identity is derived from the session. companionDeviceId must identify a linked device owned by that account which is neither revoked nor expired; the server rechecks this under a device lock before persisting. Recent heartbeat and capture permissions are separate from this linkage prerequisite. Send expectedVersion null for first creation and the returned version thereafter, plus the current seasonVersion. ACCOUNT mode requires declaration and no characterId; CHARACTER mode requires characterId and no declaration, associated Forever identity and explicit authenticated ownership verification. The production Forever verifier currently rejects verification with 503. Saving never opens a season or enables matchmaking. Cache-Control is no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonSelectionRequest' }
      responses:
        '200':
          description: Saved selection and its version
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeasonSelection' }
        '400': { description: "Invalid declaration, role, mode or character reference, or missing/malformed companionDeviceId" }
        '401': { description: "No Battle.net session" }
        '403': { description: "Missing or inactive account or invalid CSRF token" }
        '409': { description: "No configured season or stale selection or season version; fetch context before retrying" }
        '412': { description: "Selected companion is missing, belongs to another account, is revoked or has expired" }
        '503': { description: "Configured season missing or authenticated Forever verification unavailable" }
  /email-notifications/feedback/resend:
    post:
      operationId: receiveResendFeedback
      summary: Receive signed Resend delivery feedback
      description: Verifies the raw body with Svix before processing delivery, permanent bounce and complaint events. Requires a configured webhook secret.
      security: []
      parameters:
        - in: header
          name: svix-id
          required: true
          schema: {type: string}
        - in: header
          name: svix-timestamp
          required: true
          schema: {type: string}
        - in: header
          name: svix-signature
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '204':
          description: Verified event processed or ignored
        '400':
          description: Invalid event payload
        '403':
          description: Invalid or expired signature
        '413':
          description: Payload exceeds 256 KiB
        '503':
          description: Webhook secret not configured

  /email-notifications/feedback:
    post:
      operationId: receiveSesFeedback
      summary: Receive signed Amazon SNS bounce and complaint notifications
      description: AWS-only webhook. No session or CSRF token; the complete SNS envelope signature, expected topic ARN and source account are verified before processing. Raw message delivery must be disabled. Subscription confirmation is automatic for the configured topic. Repeated SNS message IDs are idempotent. Maximum request body is 256 KiB.
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, description: "Signed SNS JSON envelope" }
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '204': { description: "Subscription confirmed or feedback durably processed" }
        '400': { description: "Invalid SNS or SES payload" }
        '403': { description: "Untrusted topic, certificate URL or signature" }
        '409': { description: "Feedback subscription was removed" }
        '413': { description: "Payload too large" }
        '503': { description: "Feedback not configured or temporary AWS connection failure" }
  /season-notifications:
    get:
      operationId: getSeasonNotificationStatus
      summary: Get launch state and establish an anonymous CSRF cookie
      responses:
        '200':
          description: Notification state, without provider credentials
          content:
            application/json:
              schema:
                type: object
                required: [emailEnabled, seasonLive, subscriptionsAvailable]
                properties:
                  emailEnabled: { type: boolean }
                  seasonLive: { type: boolean }
                  subscriptionsAvailable: { type: boolean }
    post:
      operationId: subscribeToSeasonLaunch
      summary: Request one launch notification, without a Battle.net account
      description: Requires X-XSRF-TOKEN from the XSRF-TOKEN cookie. The website field is a honeypot and must be empty. Repeated and already-confirmed addresses receive the same generic response. Confirmation links expire after 48 hours; re-requests are limited to one per address per 15 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, language]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                language: { type: string, enum: [en, es, fr, de, pt-BR, ru, it] }
                website: { type: string, maxLength: 200, default: '' }
      responses:
        '202': { description: "Request accepted; confirmation may be queued if required" }
        '400': { description: "Invalid email or locale" }
        '403': { description: "Missing or invalid CSRF token" }
        '409': { description: "Season already started" }
        '429': { description: "Too many requests" }
        '503': { description: "Email delivery has not been configured" }
  /season-notifications/confirm:
    post:
      operationId: confirmSeasonNotification
      summary: Confirm an email using a bearer token and a deliberate user action
      description: Requires X-XSRF-TOKEN. Does not require Battle.net. An already-confirmed active token succeeds idempotently.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonNotificationLink' }
      responses:
        '204': { description: "Email confirmed" }
        '400': { description: "Invalid, expired or cancelled confirmation" }
        '403': { description: "Missing or invalid CSRF token" }
        '429': { description: "Too many requests" }
  /season-notifications/unsubscribe:
    post:
      operationId: cancelSeasonNotification
      summary: Cancel a notification using a bearer token and a deliberate user action
      description: Requires X-XSRF-TOKEN. Repeated cancellation succeeds idempotently. An email already in flight may complete.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeasonNotificationLink' }
      responses:
        '204': { description: "Notification cancelled" }
        '400': { description: "Invalid token" }
        '403': { description: "Missing or invalid CSRF token" }
        '429': { description: "Too many requests" }
  /moderation/season-notifications:
    get:
      operationId: getSeasonNotificationConfiguration
      summary: Moderator-only launch and configuration flags
      responses:
        '200':
          description: Non-secret configuration state
          content:
            application/json:
              schema:
                type: object
                required: [configured, seasonLive]
                properties:
                  configured: { type: boolean }
                  seasonLive: { type: boolean }
        '401': { description: "Missing authenticated session" }
        '403': { description: "Active account and current persisted moderator role required" }
  /moderation/season-notifications/launch:
    post:
      operationId: queueSeasonLaunchNotifications
      summary: Moderator-only manual launch campaign
      description: Requires X-XSRF-TOKEN, a moderator session and the server season-live flag. Operators must verify ranked play is available first. Repeating the request queues no duplicates. Counts queued messages, not delivered inboxes.
      responses:
        '200':
          description: Campaign queued durably
          content:
            application/json:
              schema:
                type: object
                required: [queued]
                properties:
                  queued: { type: integer, minimum: 0 }
        '401': { description: "Missing authenticated session" }
        '403': { description: "Active account, current persisted moderator role or valid CSRF token required" }
        '409': { description: "Season-live flag is disabled" }
        '503': { description: "Email delivery has not been configured" }
  /characters/regions:
    get:
      operationId: getCurrentUserWowRegions
      summary: List regions containing the authenticated user's WoW characters
      description: Requires an active Battle.net session and wow.profile permission. Checks EU and North America across Forever, Classic, Anniversary and Retail without a level requirement or character detail requests. Returns EU, NA, both in that order, or an empty array when no characters exist. Missing provider profiles are skipped; other failures never return a partial region list. No-store; never uses the legacy account region default.
      responses:
        '200':
          description: Detected character regions
          content:
            application/json:
              schema:
                type: array
                uniqueItems: true
                items: { type: string, enum: [EU, NA] }
        '401': { description: Missing session or expired Battle.net token }
        '403': { description: Inactive account or missing WoW profile access }
        '502': { description: Blizzard unavailable or invalid response }
        '504': { description: Blizzard request timed out }
  /characters/me:
    get:
      operationId: getCurrentUserCharacters
      summary: Get the authenticated user's WoW Forever characters in EU and North America
      description: Requires a Battle.net session with wow.profile permission. Queries only Forever in both EU (eu.api.blizzard.com, en_GB) and NA (us.api.blizzard.com, en_US) with the user token. Uses profile-forever-eu and profile-forever-us and includes level 1 and above. Characters within each regional account are ordered by descending level, then name and ID. Classic and retail are never queried for this list. Forever name is normalized to first name plus surname, and realm.id comes from the authenticated protected-character reference; realm.name is Forever and realm.slug is empty because the provider returns neither a realm object nor a ruleset. Optional profile/media requests use the Forever regional name route without a realm segment; unavailable details preserve the owned list. Preserves each regional WoW account. Account IDs may coincide across regions; identity includes namespace, WoW account, realm and character IDs. A missing profile (404) does not hide the other branches or region; other provider failures do not return a partial list. Never returns tokens.
      responses:
        '200':
          description: WoW accounts and their owned characters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WowAccountProfile'
        '401':
          description: Missing session or expired Battle.net token; sign in again
        '403':
          description: Suspended or missing rbgs.io account, missing wow.profile permission or Blizzard profile privacy restriction
        '404':
          description: Neither Forever region (EU or North America) has an accessible profile
        '502':
          description: Blizzard unavailable or returned an invalid response
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Get the current rbgs.io account and establish a CSRF cookie
      description: Returns no content when the browser has no authenticated session. Existing sessions must belong to an active persisted account; status and moderator permissions are checked on each protected request. Never returns provider tokens.
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '204':
          description: No authenticated session
        '403':
          description: Session belongs to a suspended or missing account
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/logout:
    post:
      operationId: logout
      summary: Invalidate the browser session
      description: Requires the X-XSRF-TOKEN header copied from the XSRF-TOKEN cookie.
      responses:
        '204':
          description: Session invalidated
        '403':
          description: Missing or invalid CSRF token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /health:
    get:
      operationId: getHealth
      summary: Check API process liveness
      description: Does not check PostgreSQL or ranked-play availability. Use readiness for dependency availability.
      responses:
        '200':
          description: API process is serving requests
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /readiness:
    get:
      operationId: getReadiness
      summary: Check API database readiness
      description: Public uncached dependency check using the internal PostgreSQL health contributor. Returns only a status, without database details. Does not establish Blizzard availability, character ownership, ranked readiness or measured capacity.
      responses:
        '200':
          description: PostgreSQL health is UP
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: ready }
        '503':
          description: PostgreSQL health is unavailable, unknown or missing
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, const: unavailable }
components:
  parameters:
    PremadeGroupId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    GroupInvitationId:
      name: invitationId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    PremadeGroup:
      description: Waiting premade searches are cancelled atomically on a successful roster/captain change. Changes are rejected with 409 while a proposal/preparing room reserves the group; decline or end that room first. Visual role labels and lobby-code changes do not cancel searches.
      description: Private group snapshot; no-store. Empty body when the caller has no group or just left it. Never a queue ticket or admission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PremadeGroup' }
  securitySchemes:
    soloQueueLabSession:
      type: apiKey
      in: cookie
      name: RBGS_SOLOQ_LAB
      description: Synthetic actor session in the explicitly enabled isolated local simulator only.
    webSession:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Battle.net web session; mutations also require X-XSRF-TOKEN.
    deviceCredential:
      type: http
      scheme: bearer
      description: Opaque account-bound rbgs.io device token, not a Battle.net token.
  schemas:
    SoloQueueLabMember:
      type: object
      required: [accountId, name, role, captain, accepted]
      properties:
        accountId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [FC, HEALER, DPS] }
        captain: { type: boolean }
        accepted: { type: boolean }
    SoloQueueLabRoom:
      type: object
      required: [id, source, status, acceptanceDeadline, preparationDeadline, cancellationReason, version, teamA, teamB]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [SIMULATION, FOREVER] }
        status: { type: string, enum: [PROPOSED, PREPARING, CANCELLED] }
        acceptanceDeadline: { type: string, format: date-time }
        preparationDeadline: { type: [string, 'null'], format: date-time }
        cancellationReason: { type: [string, 'null'] }
        version: { type: integer, format: int64 }
        teamA: { type: array, minItems: 10, maxItems: 10, items: { $ref: '#/components/schemas/SoloQueueLabMember' } }
        teamB: { type: array, minItems: 10, maxItems: 10, items: { $ref: '#/components/schemas/SoloQueueLabMember' } }
    SoloQueueLabSnapshot:
      type: object
      required: [simulation, generation, scenario, serverTime, accountId, players, queueDepth, ticket, room, revision]
      properties:
        simulation: { type: boolean, const: true }
        generation: { type: [string, 'null'], format: uuid }
        scenario: { type: string, enum: [NORMAL, NO_CAPTAINS, NO_HEALERS] }
        serverTime: { type: string, format: date-time }
        accountId: { type: [string, 'null'], format: uuid }
        queueDepth: { type: integer, minimum: 0 }
        revision: { type: string, description: Opaque committed-state fingerprint; always resync after reconnect. }
        players:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, name, role, captainConsent]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              role: { type: string, enum: [FC, HEALER, DPS] }
              captainConsent: { type: boolean, description: 'SoloQ volunteer priority. False does not prevent automatic captain assignment when the team has no volunteer.' }
        ticket:
          type: [object, 'null']
          properties:
            id: { type: string, format: uuid }
            state: { type: string, enum: [QUEUED, PROPOSED] }
            enteredAt: { type: string, format: date-time }
            version: { type: integer, format: int64 }
        room:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SoloQueueLabRoom' }
    SoloQueueRoom:
      allOf:
        - { $ref: '#/components/schemas/SoloQueueLabRoom' }
        - type: object
          properties:
            source: { type: string, const: FOREVER }
      description: Private real-player room. Source is FOREVER; names contain character and realm, never private Battle.net contact tags. Hidden MMR is excluded.
    PremadeQueueAdmission:
      type: object
      required: [groupId, groupRevision]
      properties:
        groupId: { type: string, format: uuid }
        groupRevision: { type: integer, format: int64, minimum: 0 }
    PremadeQueueStatus:
      allOf:
        - { $ref: '#/components/schemas/SoloQueueStatus' }
        - type: object
          required: [simulation, groupId, groupRevision, captainId, canControl]
          properties:
            simulation: { type: boolean, const: false }
            groupId: { type: [string, 'null'], format: uuid }
            groupRevision: { type: [integer, 'null'], format: int64 }
            captainId: { type: [string, 'null'], format: uuid }
            canControl: { type: boolean }
      description: Private premade status. Ticket ID identifies the ten-player entry for group cancellation, not an individual ticket. No hidden MMR, complete evidence or other queues' snapshots are exposed. Availability reflects server-resolved eligibility; it remains false with the default unavailable game gateway. Initial MMR is persisted as 1500 with visible rating 0, independently by season, queue and ACCOUNT/CHARACTER subject. Result movements/replay remain feature 12.
    PremadeLabStatus:
      type: object
      required: [simulation, available, blockers, groupId, groupRevision, captainId, canControl, ticket, room, matchId, serverTime, revision]
      properties:
        simulation: { type: boolean, const: true }
        available: { type: boolean }
        blockers: { type: array, items: { type: string } }
        groupId: { type: [string, 'null'], format: uuid }
        groupRevision: { type: [integer, 'null'], format: int64 }
        captainId: { type: [string, 'null'], format: uuid }
        canControl: { type: boolean }
        ticket: { $ref: '#/components/schemas/SoloQueueStatus/properties/ticket' }
        room:
          anyOf:
            - { $ref: '#/components/schemas/SoloQueueLabRoom' }
            - { type: 'null' }
        matchId: { type: 'null' }
        serverTime: { type: string, format: date-time }
        revision: { type: string }
    PremadeLabSetup:
      type: object
      required: [generation, accountId, players, queueDepth]
      properties:
        generation: { type: [string, 'null'], format: uuid }
        accountId: { type: [string, 'null'], format: uuid }
        queueDepth: { type: integer, minimum: 0, description: Number of waiting ten-player groups in this simulation }
        players:
          type: array
          items:
            type: object
            required: [id, name, groupId, captain]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              groupId: { type: string, format: uuid }
              captain: { type: boolean }
    SoloQueueStatus:
      type: object
      required: [available, blockers, ticket, room, matchId, serverTime, revision]
      properties:
        available: { type: boolean }
        blockers: { type: array, items: { type: string } }
        serverTime: { type: string, format: date-time }
        revision: { type: string }
        matchId: { type: [string, 'null'], format: uuid }
        room:
          anyOf:
            - { $ref: '#/components/schemas/SoloQueueRoom' }
            - { type: 'null' }
        ticket:
          type: [object, 'null']
          required: [id, state, enteredAt, proposalId, version, cancellationReason]
          properties:
            id: { type: string, format: uuid }
            state: { type: string, enum: [QUEUED, PROPOSED, CANCELLED] }
            enteredAt: { type: string, format: date-time }
            proposalId: { type: [string, 'null'], format: uuid }
            version: { type: integer, format: int64 }
            cancellationReason: { type: [string, 'null'] }
    PlayCharacterReference:
      type: object
      required: [namespace, wowAccountId, realmId, characterId]
      properties:
        namespace: { type: string, enum: [profile-classic1x-eu, profile-classic-eu, profile-classicann-eu, profile-classic1x-us, profile-classic-us, profile-classicann-us, profile-forever-eu, profile-forever-us] }
        wowAccountId: { type: integer, format: int64, minimum: 1 }
        realmId: { type: integer, format: int64, minimum: 1 }
        characterId: { type: integer, format: int64, minimum: 1 }
    PlayCharacterSelected:
      allOf:
        - { $ref: '#/components/schemas/PlayCharacterReference' }
        - type: object
          required: [region, name, realm, character]
          properties:
            character:
              anyOf:
                - { $ref: '#/components/schemas/WowCharacter' }
                - { type: 'null' }
              description: Selected provider profile refreshed by the verified picker; legacy choices may have no profile yet.
            region: { type: string, enum: [EU, NA] }
            name: { type: string }
            realm: { type: string }
    GroupRevision:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, format: int64, minimum: 0 }
    GroupTargetCommand:
      allOf:
        - { $ref: '#/components/schemas/GroupRevision' }
        - type: object
          required: [accountId]
          properties:
            accountId: { type: string, format: uuid }
    GroupInvitation:
      type: object
      required: [id, groupId, captainName, recipientName, expiresAt]
      properties:
        id: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        captainName: { type: string }
        recipientName: { type: string }
        expiresAt: { type: string, format: date-time, description: Server deadline, 60 seconds after creation or renewal. Each invitation expires independently. }
    PremadeGroup:
      type: object
      required: [id, captainId, revision, region, lobbyCode, members, invitations, queueReady, blockers]
      properties:
        id: { type: string, format: uuid }
        captainId: { type: string, format: uuid }
        revision: { type: integer, format: int64, minimum: 0 }
        region: { type: string, enum: [EU, NA], description: Fixed from the creator's verified selected Play character; unaffected by captain changes. }
        lobbyCode:
          type: [string, 'null']
          pattern: '^[A-HJ-NP-Z2-9]{8}$'
          description: Shared code visible only to group members; null when disabled. Do not log or publish.
        members:
          type: array
          maxItems: 10
          items:
            type: object
            required: [accountId, displayName, captain, characterName, realm, role, roleVersion, selectionVersion, confirmed, companionConnected, addonStatus, gamePresence, blockers, character]
            properties:
              accountId: { type: string, format: uuid }
              displayName: { type: string }
              captain: { type: boolean }
              character:
                anyOf:
                  - { $ref: '#/components/schemas/WowCharacter' }
                  - { type: 'null' }
                description: Only the selected provider character, shared privately with lobby members; excludes WoW account IDs, tokens and the remaining catalog. No competitive statistics are invented.
              characterName: { type: [string, 'null'] }
              realm: { type: [string, 'null'] }
              role: { type: string, enum: [FC, HEALER, DPS], default: DPS, description: Always-selected visual lobby label; defaults to DPS for new memberships and cannot be cleared. Independent of SoloQ and never used to balance premades. }
              roleVersion: { type: integer, minimum: 0 }
              selectionVersion: { type: [integer, 'null'], minimum: 0 }
              confirmed: { type: boolean, description: Version-bound member confirmation; not proof of eligibility }
              companionConnected: { type: boolean, description: Selected non-revoked device heartbeat within 45 seconds; not game presence }
              addonStatus: { type: string, enum: [UNVERIFIED] }
              gamePresence: { type: string, enum: [UNKNOWN] }
              blockers:
                type: array
                items: { type: string, enum: [PLAY_CHARACTER_REQUIRED, REGION_MISMATCH, ACCOUNT_UNAVAILABLE, SEASON_UNAVAILABLE, SELECTION_REQUIRED, SELECTION_INVALID, COMPANION_DISCONNECTED, CAPTURE_PERMISSION_REQUIRED, ADDON_STATUS_UNVERIFIED, MATCH_UNRESOLVED] }
        invitations:
          type: array
          description: Outgoing invitations visible only to the captain
          items: { $ref: '#/components/schemas/GroupInvitation' }
        queueReady: { type: boolean, const: false, description: Remains false until compatibility and queue admission are implemented }
        blockers:
          type: array
          items: { type: string, enum: [TEN_PLAYERS_REQUIRED, MEMBERS_NOT_ELIGIBLE, FOREVER_COMPATIBILITY_UNVERIFIED, MATCHMAKING_UNAVAILABLE] }
    BrowserPairingApproval:
      type: object
      required: [approvalSecret]
      properties:
        approvalSecret: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        acceptCapturePermissions: { type: boolean, default: false }
    CaptureIdentity:
      type: object
      additionalProperties: false
      required: [name, realm]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        realm: { type: [string, 'null'], minLength: 1, maxLength: 128 }
        guid: { type: [string, 'null'], minLength: 1, maxLength: 128 }
    DisputeWrite:
      type: object
      additionalProperties: false
      required: [expectedVersion, message]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        message: { type: string, minLength: 1, maxLength: 2000, description: 'Nonblank plain text; no file uploads' }
    MatchDisputeThread:
      type: object
      additionalProperties: false
      required: [id, status, version, openedAt, updatedAt, unread, messages, olderMessages]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, WAITING_PLAYER, RESOLVED] }
        version: { type: integer, format: int64, minimum: 0 }
        openedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        unread: { type: boolean }
        olderMessages: { type: boolean }
        messages:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [id, author, kind, body, at]
            properties:
              id: { type: string, format: uuid }
              author: { type: string, enum: [PLAYER, MODERATOR, SYSTEM] }
              kind: { type: string, enum: [DISPUTE_OPENED, PLAYER_REPLY, EVIDENCE_REQUEST, DECISION, CANCELLED] }
              body: { type: string, maxLength: 2000 }
              at: { type: string, format: date-time }
    ParticipantHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ParticipantHistoryItem' } }
        nextCursor: { type: [string, 'null'], maxLength: 256 }
    ParticipantHistoryItem:
      type: object
      additionalProperties: false
      required: [matchId, createdAt, mode, evidencePolicy, map, character, team, result, verification, disputeStatus, unread, cancelled]
      properties:
        matchId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        mode: { type: string, enum: [CONTROLLED_TEST, MATCHMADE] }
        evidencePolicy: { type: string, enum: [CAPTURE_ONLY, FULL_ROSTER] }
        map: { type: [string, 'null'], maxLength: 128, description: 'Known assigned map display name; unknown profiles remain null' }
        character:
          type: object
          required: [name, realm]
          properties:
            name: { type: string, maxLength: 512 }
            realm: { type: [string, 'null'], maxLength: 128 }
        team: { type: [string, 'null'], enum: [A, B, null] }
        result: { type: string, enum: [WIN, LOSS, DRAW, PENDING, REVIEW, VOIDED, CANCELLED] }
        verification: { $ref: '#/components/schemas/MatchResult' }
        disputeStatus: { type: [string, 'null'], enum: [OPEN, WAITING_PLAYER, RESOLVED, null] }
        unread: { type: boolean }
        cancelled: { type: boolean }
    ParticipantMatchDetail:
      type: object
      additionalProperties: false
      required: [match, roster, capture, dispute, updates, olderUpdates, canDispute]
      properties:
        match: { $ref: '#/components/schemas/ParticipantHistoryItem' }
        roster:
          type: array
          maxItems: 40
          items:
            type: object
            required: [name, realm, team, you]
            properties:
              name: { type: string, maxLength: 512 }
              realm: { type: [string, 'null'], maxLength: 128 }
              team: { type: [string, 'null'], enum: [A, B, null] }
              you: { type: boolean }
        capture:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [startedAt, endedAt, durationSeconds, stats, delivery, product, build, revision]
              properties:
                startedAt: { type: [string, 'null'], format: date-time }
                endedAt: { type: [string, 'null'], format: date-time }
                durationSeconds: { type: [integer, 'null'], minimum: 0 }
                delivery: { type: string, const: RECEIVED }
                product: { type: [string, 'null'] }
                build: { type: [string, 'null'] }
                revision: { type: integer, minimum: 1 }
                stats:
                  oneOf:
                    - { type: 'null' }
                    - type: object
                      description: Own immutable scoreboard observations; unknowns remain null
                      required: [killingBlows, deaths, honorableKills, damage, healing, flagsCaptured, flagsReturned]
                      properties:
                        killingBlows: { type: [integer, 'null'], minimum: 0 }
                        deaths: { type: [integer, 'null'], minimum: 0 }
                        honorableKills: { type: [integer, 'null'], minimum: 0 }
                        damage: { type: [integer, 'null'], minimum: 0 }
                        healing: { type: [integer, 'null'], minimum: 0 }
                        flagsCaptured: { type: [integer, 'null'], minimum: 0 }
                        flagsReturned: { type: [integer, 'null'], minimum: 0 }
        dispute:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/MatchDisputeThread' }
        updates:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, at, status, reason, explanation, outcome, winningTeam]
            properties:
              id: { type: string, format: uuid }
              at: { type: string, format: date-time }
              status: { type: string, enum: [PENDING, REVIEW, VERIFIED, RESOLVED, VOIDED] }
              reason: { type: [string, 'null'] }
              explanation: { type: [string, 'null'], maxLength: 2000 }
              outcome: { type: [string, 'null'], enum: [WIN, DRAW, null] }
              winningTeam: { type: [string, 'null'], enum: [A, B, null] }
        olderUpdates: { type: boolean }
        canDispute: { type: boolean }
    ModeratorDecision:
      type: object
      additionalProperties: false
      required: [expectedVersion, outcome, reason, evidenceIds]
      properties:
        expectedVersion: { type: integer, format: int64, minimum: 0 }
        outcome: { type: string, enum: [WIN, DRAW, VOID] }
        winningTeam: { type: [string, 'null'], enum: [A, B, null], description: 'Required A/B for WIN; null or omitted for DRAW/VOID' }
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Nonblank explanation visible to participants' }
        evidenceIds: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string, format: uuid } }
    ModerationMatchPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/ModerationMatchSummary' } }
        nextCursor: { type: [string, 'null'], maxLength: 256 }
    ModerationMatchSummary:
      type: object
      additionalProperties: false
      required: [matchId, mode, evidencePolicy, profile, createdAt, captureStartDeadline, cancelledAt, roster, result, canCancel]
      properties:
        matchId: { type: string, format: uuid }
        mode: { type: string, enum: [CONTROLLED_TEST, MATCHMADE] }
        evidencePolicy: { type: string, enum: [FULL_ROSTER, CAPTURE_ONLY] }
        profile: { type: string }
        createdAt: { type: string, format: date-time }
        captureStartDeadline: { type: string, format: date-time }
        cancelledAt: { type: [string, 'null'], format: date-time }
        roster:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [name, realm, team]
            properties:
              name: { type: string, maxLength: 128 }
              realm: { type: [string, 'null'], maxLength: 128 }
              team: { type: [string, 'null'], enum: [A, B, null] }
        result: { $ref: '#/components/schemas/MatchResult' }
        canCancel: { type: boolean }
    MatchResult:
      type: object
      additionalProperties: false
      required: [matchId, mode, status, reason, outcome, winningTeam, reportsA, reportsB, requiredPerTeam, deadline, version, policyVersion, ratingApplied, explanation, resolvedAt]
      properties:
        matchId: { type: string, format: uuid }
        mode: { type: string, enum: [CONTROLLED_TEST, MATCHMADE] }
        status: { type: string, enum: [PENDING, VERIFIED, REVIEW, RESOLVED, VOIDED] }
        reason: { type: [string, 'null'] }
        outcome: { type: [string, 'null'], enum: [WIN, DRAW, null] }
        winningTeam: { type: [string, 'null'], enum: [A, B, null] }
        reportsA: { type: integer, minimum: 0, description: 'Distinct assigned accounts with valid observations, including conflicting votes when under review' }
        reportsB: { type: integer, minimum: 0 }
        requiredPerTeam: { type: integer, const: 6 }
        deadline: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64, minimum: 0 }
        policyVersion: { type: string, const: controlled-roster-v1 }
        ratingApplied: { type: boolean, const: false }
        explanation: { type: [string, 'null'], maxLength: 2000, description: 'Participant-visible moderator reason, only for RESOLVED or VOIDED' }
        resolvedAt: { type: [string, 'null'], format: date-time }
    CaptureTestResult:
      deprecated: true
      allOf:
        - { $ref: '#/components/schemas/MatchResult' }
    CaptureReceipt:
      type: object
      additionalProperties: false
      required: [schemaVersion, evidenceId, assignmentId, captureId, captureRevision, receivedAt, durablyStored, processingStatus, contentSha256]
      properties:
        schemaVersion: { type: integer, const: 2 }
        evidenceId: { type: string, format: uuid }
        assignmentId: { type: string, format: uuid }
        captureId: { type: string, format: uuid }
        captureRevision: { type: integer, minimum: 1, maximum: 2147483647 }
        receivedAt: { type: string, format: date-time }
        durablyStored: { type: boolean, const: true }
        processingStatus: { type: string, enum: [PENDING, REVIEW] }
        contentSha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    Device:
      type: object
      required: [id, createdAt, expiresAt, revokedAt, scope, lastSeenAt, connected]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        lastSeenAt: { type: [string, 'null'], format: date-time, description: 'Latest authenticated native heartbeat at server time' }
        connected: { type: boolean, description: 'Recent signal from this device; not game participation or physical browser co-location' }
        scope: { type: string, enum: ['companion:status', 'companion:status companion:assignments evidence:write'] }
    PlaySelectionContext:
      type: object
      required: [season, selection, ownershipVerification, matchmakingAvailable]
      properties:
        season:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SelectionSeason' }
        selection:
          oneOf:
            - { type: 'null' }
            - { $ref: '#/components/schemas/SeasonSelection' }
        ownershipVerification: { type: string, const: UNVERIFIED }
        matchmakingAvailable: { type: boolean, const: false }
    SelectionSeason:
      type: object
      required: [id, name, kind, ratingSubjectType, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [BETA, PUBLIC] }
        ratingSubjectType: { type: string, enum: [ACCOUNT, CHARACTER] }
        version: { type: integer, format: int64, minimum: 0 }
    SeasonSelectionRequest:
      type: object
      required: [seasonId, seasonVersion, role, captainConsent, companionDeviceId]
      properties:
        seasonId: { type: string, format: uuid }
        seasonVersion: { type: integer, format: int64, minimum: 0 }
        companionDeviceId: { type: string, format: uuid, description: "Selected linked companion device belonging to the authenticated account; must not be revoked or expired" }
        expectedVersion: { type: [integer, 'null'], format: int64, minimum: 0, description: "Null for first creation; saved version for replacement" }
        characterId: { type: [string, 'null'], format: uuid }
        declaration:
          type: [object, 'null']
          required: [name, realm]
          properties:
            name: { type: string, minLength: 1, maxLength: 100, description: "Nonblank text without control characters" }
            realm: { type: string, minLength: 1, maxLength: 100, description: "Provisional declaration uses the selected Classic character realm; not verified Forever ownership" }
        role: { type: string, enum: [FC, HEALER, DPS] }
        captainConsent: { type: boolean, description: 'SoloQ volunteer priority. False does not prevent automatic captain assignment when the team has no volunteer.' }
    PremadeSelectionRequest:
      type: object
      required: [seasonId, seasonVersion, companionDeviceId]
      properties:
        seasonId: { type: string, format: uuid }
        seasonVersion: { type: integer, format: int64, minimum: 0 }
        companionDeviceId: { type: string, format: uuid, description: "Selected linked companion device belonging to the authenticated account; must not be revoked or expired" }
        expectedVersion: { type: [integer, 'null'], format: int64, minimum: 0, description: "Null for first creation; saved version for replacement" }
        characterId: { type: [string, 'null'], format: uuid }
        declaration:
          type: [object, 'null']
          required: [name, realm]
          properties:
            name: { type: string, minLength: 1, maxLength: 100, description: "Nonblank text without control characters" }
            realm: { type: string, minLength: 1, maxLength: 100, description: "Provisional declaration uses the selected Classic character realm; not verified Forever ownership" }
    SeasonSelection:
      type: object
      required: [characterId, name, realm, source, ratingSubjectType, ratingSubjectId, role, captainConsent, version, validForSeason]
      properties:
        characterId: { type: string, format: uuid, description: "Internal identity; not a Blizzard ID or a game GUID" }
        name: { type: string }
        realm: { type: string }
        source: { type: string, enum: [DECLARED, BLIZZARD_VERIFIED] }
        ratingSubjectType: { type: string, enum: [ACCOUNT, CHARACTER] }
        ratingSubjectId: { type: string, format: uuid, description: "Prospective account or character subject; no rating record is created" }
        role: { type: string, enum: [FC, HEALER, DPS], default: DPS, description: Competitive SoloQ role; defaults to DPS for a new Premade-only selection and cannot be cleared. Existing SoloQ preferences are preserved. }
        captainConsent: { type: boolean, description: 'SoloQ volunteer priority. False does not prevent automatic captain assignment when the team has no volunteer.' }
        version: { type: integer, format: int64, minimum: 0 }
        validForSeason: { type: boolean, description: "Stored mode/provenance match the current season; not proof of fresh ownership, setup readiness or queue eligibility" }
    SeasonNotificationLink:
      type: object
      required: [token]
      properties:
        token: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
    WowAccountProfile:
      type: object
      required: [wow_accounts]
      properties:
        wow_accounts:
          type: array
          items:
            type: object
            required: [id, characters]
            properties:
              id:
                type: integer
                format: int64
              characters:
                type: array
                items:
                  $ref: '#/components/schemas/WowCharacter'
    WowCharacter:
      type: object
      required: [namespace]
      properties:
        gender:
          anyOf:
            - $ref: '#/components/schemas/WowNamedReference'
            - type: 'null'
          description: Character gender from Blizzard (type MALE or FEMALE); null when unavailable.
        guild:
          anyOf:
            - $ref: '#/components/schemas/WowNamedReference'
            - type: 'null'
          description: Optional guild from the character profile; null when unguilded or unavailable.
        namespace:
          type: string
          enum: [profile-classic1x-eu, profile-classic-eu, profile-classic1x-us, profile-classic-us, profile-classicann-eu, profile-classicann-us, profile-forever-eu, profile-forever-us]
          description: Source branch and region, part of identity alongside account/realm/character IDs. Play includes only Forever at level 1+. A display preference does not establish competitive eligibility. The web displays us as NA.
        avatarUrl:
          type: [string, 'null']
          format: uri
          description: Optional default Blizzard portrait; prefers SD for Forever, falling back to HD. Null when character media is unavailable.
        avatarSdUrl:
          type: [string, 'null']
          format: uri
          description: Optional SD portrait returned by Forever character media.
        avatarHdUrl:
          type: [string, 'null']
          format: uri
          description: Optional original HD portrait, for viewers who prefer HD.
        insetUrl:
          type: [string, 'null']
          format: uri
          description: Optional wider Blizzard portrait; null when not provided.
        id:
          type: integer
          format: int64
        name:
          type: string
        level:
          type: integer
          minimum: 1
          description: Forever includes level 1 and above. The separate moderator Anniversary test picker retains its existing level-1 minimum. No battleground eligibility is asserted.
        realm:
          type: object
          properties:
            id:
              type: integer
              format: int64
            name:
              type: string
            slug:
              type: string
        playable_class:
          $ref: '#/components/schemas/WowNamedReference'
        playable_race:
          $ref: '#/components/schemas/WowNamedReference'
        faction:
          $ref: '#/components/schemas/WowNamedReference'
    WowNamedReference:
      type: object
      properties:
        id:
          type: [integer, 'null']
          format: int64
        name:
          type: [string, 'null']
        type:
          type: [string, 'null']
    Profile:
      type: object
      required: [id, displayName, region, role]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        region:
          type: string
          const: EU
        role:
          type: string
          enum: [USER, MODERATOR]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
