spring:
  config:
    import: optional:file:./.env[.properties]
  application:
    name: rbgs-api
  datasource:
    url: ${RBGS_DB_URL:jdbc:postgresql://localhost:55432/rbgs}
    username: ${RBGS_DB_USER:rbgs}
    password: ${RBGS_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: rbgs
    default-schema: rbgs
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          battle-net:
            provider: battle-net
            client-id: ${RBGS_BNET_CLIENT_ID}
            client-secret: ${RBGS_BNET_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: ${RBGS_BNET_REDIRECT_URI}
            scope: openid,wow.profile
        provider:
          battle-net:
            issuer-uri: https://oauth.battle.net

rbgs:
  notifications:
    sending-enabled: ${RBGS_EMAIL_ENABLED:false}
    region: ${RBGS_SES_REGION:}
    from: ${RBGS_EMAIL_FROM:}
    token-secret: ${RBGS_NOTIFICATION_TOKEN_SECRET:}
    season-live: ${RBGS_SEASON_LIVE:false}
    daily-limit: ${RBGS_EMAIL_DAILY_LIMIT:90}
    web-origin: ${RBGS_WEB_ORIGIN}
  auth:
    web-origin: ${RBGS_WEB_ORIGIN}

server:
  port: ${RBGS_API_PORT:${PORT:8080}}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${RBGS_SECURE_COOKIES:true}

management:
  server:
    port: ${RBGS_MANAGEMENT_PORT:8081}
    address: ${RBGS_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
