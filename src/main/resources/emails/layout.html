<!doctype html><html lang="{{language}}"><body style="margin:0;background:#070808;color:#fafaf6;font-family:Arial,sans-serif">
<div style="max-width:480px;margin:32px auto;padding:32px;background:#121514;border:1px solid #ffffff26;border-radius:12px">
<p style="margin:0 0 24px"><a href="{{home}}" style="font-family:Inter,Arial,sans-serif;color:#fafaf6!important;font-weight:800;font-size:20px;line-height:1.2;letter-spacing:-.06em;text-decoration:none;white-space:nowrap"><span style="color:#fafaf6">rbgs.io</span></a></p>
<h1 style="font-size:28px">{{heading}}</h1>
<p style="color:#b5b5ab;line-height:1.7">{{message}}</p>
<p style="margin-top:28px"><a style="display:inline-block;background:#facc15;color:#151408;padding:14px 20px;text-decoration:none;border-radius:4px;font-weight:bold" href="{{actionUrl}}">{{action}}</a></p>
<p style="margin-top:32px;font-size:12px"><a style="color:#a4a49a" href="{{unsubscribeUrl}}">{{unsubscribe}}</a></p>
</div></body></html>
