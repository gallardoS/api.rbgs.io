spring.config.import=optional:file:./.env[.properties]
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
rbgs.auth.web-origin=http://localhost:5173
rbgs.matches.processing-delay-ms=3600000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=0
rbgs.soloq.cycle-ms=3600000
rbgs.soloq.worker=false
rbgs.premade.worker=false
rbgs.groups.lifecycle.startup-grace-ms=3600000
